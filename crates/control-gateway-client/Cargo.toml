[package]
name = "cargo-dispatch-control-gateway-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
cargo-dispatch-addressing-gateway = { path = "../addressing-gateway" }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
