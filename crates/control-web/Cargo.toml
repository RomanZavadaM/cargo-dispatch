[package]
name = "cargo-dispatch-control-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
cargo-dispatch-domain = { path = "../domain" }
cargo-dispatch-trip-files = { path = "../trip-files" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
cargo-dispatch-contracts = { path = "../contracts" }
cargo-dispatch-planner = { path = "../planner" }
tempfile = "3"
