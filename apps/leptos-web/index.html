<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cargo dispatch UI probe</title>
  <link data-trunk rel="rust" data-bin="ui-probe-leptos" />
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 28px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .12em; opacity: .65; }
    .metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; margin: 22px 0; }
    .metrics article { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; padding: 16px; display: grid; gap: 6px; }
    .metrics strong { font-size: 1.55rem; }
    .pool-section { display: grid; gap: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
    .toolbar label { display: grid; gap: 5px; min-width: min(420px,100%); flex: 1; }
    .toolbar input { width: 100%; padding: 9px 11px; }
    .sorts, .mode-switch, .editor-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .sorts button, .open-row, #edit-request, .mode-switch button, .editor-actions button, .unsaved-warning button { padding: 8px 10px; }
    .pool-status { margin: 0; padding: 9px 0; min-width: 130px; }
    .note { opacity: .72; margin: 0; }
    .table-wrap { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; }
    .pool-scroll { overflow: auto; height: 64vh; min-height: 420px; }
    table { width: 100%; border-collapse: collapse; min-width: 1050px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent); text-align: left; white-space: nowrap; }
    th { position: sticky; top: 0; z-index: 2; background: Canvas; }
    .pool-row:focus-within { outline: 2px solid Highlight; outline-offset: -2px; }
    .row-detail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 12px; }
    .editor { display: grid; gap: 16px; padding: 18px; border: 2px solid color-mix(in srgb, Highlight 55%, CanvasText 20%); border-radius: 14px; }
    .editor-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: start; }
    .editor-head h2, .editor-head p { margin: 0; }
    .editor-origin { display: grid; gap: 4px; min-width: 220px; }
    #editor-dirty { color: color-mix(in srgb, CanvasText 78%, Highlight); }
    .editor-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; }
    .editor-field-wrap { display: grid; gap: 4px; min-width: 0; }
    .editor-field { width: 100%; min-width: 0; padding: 8px 9px; }
    .validation-errors, .unsaved-warning { display: grid; gap: 8px; padding: 12px; border: 1px solid color-mix(in srgb, red 55%, CanvasText 20%); border-radius: 10px; }
    .validation-errors ul { margin: 0; padding-left: 22px; }
    .unsaved-warning div { display: flex; gap: 8px; flex-wrap: wrap; }
    .saved-message { padding: 10px 12px; border: 1px solid color-mix(in srgb, green 50%, CanvasText 20%); border-radius: 10px; margin: 0; }
    .route-panel { display: grid; gap: 14px; margin-top: 18px; padding: 18px; border: 2px solid color-mix(in srgb, Highlight 45%, CanvasText 18%); border-radius: 14px; }
    .route-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; flex-wrap: wrap; }
    .route-head h2, .route-head p { margin: 0; }
    .route-state { display: grid; gap: 4px; min-width: 220px; }
    .route-metrics { display: flex; gap: 10px; flex-wrap: wrap; }
    .route-metrics span { padding: 7px 9px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 9px; }
    .route-points { display: grid; gap: 8px; }
    .route-point { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 10px; }
    .route-point[data-status="confirmed"] { border-width: 2px; }
    .route-point-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .route-position { min-width: 28px; text-align: center; font-size: 1.1rem; }
    .route-point-main > div { display: grid; gap: 3px; min-width: 0; }
    .route-point-meta { opacity: .72; font-size: .92rem; overflow-wrap: anywhere; }
    .route-actions, .route-footer-actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .route-actions button, .route-footer-actions button, .route-preview button { padding: 7px 9px; }
    .route-message { min-height: 1.3em; margin: 0; opacity: .85; }
    .route-preview { display: grid; gap: 10px; padding: 13px; border: 1px solid color-mix(in srgb, Highlight 60%, CanvasText 20%); border-radius: 10px; }
    .route-preview h3 { margin: 0; }
    @media (max-width: 1100px) {
      .editor-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 800px) {
      .shell { padding: 16px; }
      .metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .pool-scroll { height: 70vh; }
      .editor-grid { grid-template-columns: 1fr; }
      .route-point { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body></body>
</html>
