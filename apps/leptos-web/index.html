<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cargo dispatch UI probe</title>
  <link data-trunk rel="rust" data-bin="ui-probe-leptos" />
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    .shell { max-width: 1400px; margin: 0 auto; padding: 32px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .12em; opacity: .65; }
    .metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; margin: 24px 0; }
    .metrics article { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; padding: 18px; display: grid; gap: 6px; }
    .metrics strong { font-size: 1.75rem; }
    .note { opacity: .72; }
    .table-wrap { overflow: auto; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent); text-align: left; }
    th { position: sticky; top: 0; background: Canvas; }
  </style>
</head>
<body></body>
</html>
