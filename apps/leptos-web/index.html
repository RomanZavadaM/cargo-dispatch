<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cargo dispatch UI probe</title>
  <link data-trunk rel="rust" data-bin="ui-probe-leptos" />
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    button, input { font: inherit; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 28px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .12em; opacity: .65; }
    .metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; margin: 22px 0; }
    .metrics article { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; padding: 16px; display: grid; gap: 6px; }
    .metrics strong { font-size: 1.55rem; }
    .pool-section { display: grid; gap: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
    .toolbar label { display: grid; gap: 5px; min-width: min(420px,100%); flex: 1; }
    .toolbar input { width: 100%; padding: 9px 11px; }
    .sorts { display: flex; gap: 8px; }
    .sorts button, .open-row { padding: 8px 10px; cursor: pointer; }
    .pool-status { margin: 0; padding: 9px 0; min-width: 130px; }
    .note { opacity: .72; margin: 0; }
    .table-wrap { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; }
    .pool-scroll { overflow: auto; height: 64vh; min-height: 420px; }
    table { width: 100%; border-collapse: collapse; min-width: 1050px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent); text-align: left; white-space: nowrap; }
    th { position: sticky; top: 0; z-index: 2; background: Canvas; }
    .pool-row:focus-within { outline: 2px solid Highlight; outline-offset: -2px; }
    .row-detail { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 12px; }
    @media (max-width: 800px) {
      .shell { padding: 16px; }
      .metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .pool-scroll { height: 70vh; }
    }
  </style>
</head>
<body></body>
</html>
