<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Cargo Dispatch — Control</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1f2328; background: #f5f6f7; }
    body { margin: 0; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px; }
    h1 { margin-top: 0; }
    section { background: white; border: 1px solid #d8dee4; border-radius: 12px; padding: 18px; margin: 14px 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: grid; gap: 5px; font-weight: 600; align-content: start; }
    input { padding: 9px 10px; border: 1px solid #b7bec7; border-radius: 7px; font: inherit; }
    button { padding: 9px 13px; border: 1px solid #8c959f; border-radius: 7px; background: #fff; font: inherit; cursor: pointer; }
    button.primary { background: #1769aa; color: white; border-color: #1769aa; }
    button.danger { color: #9a1b1b; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .status { padding: 10px; border-radius: 8px; background: #eef3f8; }
    .error { color: #a40000; }
    .ok { color: #176b2c; }
    main > p[role="status"] { position: sticky; bottom: 8px; z-index: 30; padding: 10px 14px; border: 1px solid #d8dee4; border-radius: 8px; background: #fff; box-shadow: 0 2px 12px #0003; }
    code { overflow-wrap: anywhere; }
    .toolbar, .access-line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    .access-line { justify-content: space-between; background: white; border: 1px solid #d8dee4; border-radius: 10px; padding: 10px 14px; }
    .access-dialog { display: none; }
    .access-dialog.open { display: flex; position: fixed; inset: 0; z-index: 20; justify-content: center; align-items: flex-start; overflow: auto; padding: 24px 24px 90px; background: #0008; }
    .access-box { width: min(780px, 100%); background: white; border-radius: 12px; padding: 18px; }
    .access-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .access-head h2 { margin: 0; }
    .choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid #d8dee4; border-radius: 10px; padding: 10px 12px; margin: 8px 0; cursor: pointer; font-weight: 400; }
    .choice.selected { border: 2px solid #1769aa; background: #eef5fb; }
    .choice input { margin-top: 4px; }
    .hint { display: block; color: #5f6670; font-weight: 400; font-size: 13px; }
    .warn { background: #fdeeee; border: 1px solid #e8b4b4; border-radius: 8px; padding: 4px 12px 12px; margin: 10px 0; }
    .steps { display: flex; gap: 8px; flex-wrap: wrap; list-style: none; padding: 0; }
    .steps li { flex: 1 1 200px; border: 1px solid #d8dee4; border-radius: 8px; padding: 10px; color: #5f6670; }
    .steps li.now { border: 2px solid #1769aa; background: #eef5fb; color: #1f2328; }
    .steps li.done { color: #176b2c; }
    .link-text { display: block; background: #f1f4f6; border-radius: 6px; padding: 6px 8px; margin: 4px 0; user-select: all; }
    details { margin-top: 10px; }
    summary { cursor: pointer; }
    .hidden { display: none !important; }
    ul { padding-left: 20px; }
    .note { color: #5f6670; }
    .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
    .context-card { border: 1px solid #d8dee4; border-radius: 10px; padding: 12px; background: #f8fafb; }
    .context-card h3 { margin-top: 0; }
    .context-item { padding: 6px 0; border-top: 1px solid #e6e9ed; }
    body.session-window .manager-only { display: none; }
    .trip-map { position: relative; height: 420px; overflow: hidden; border: 1px solid #c8d0d8; border-radius: 10px; background: #e7ecef; touch-action: none; }
    .map-tiles, .map-overlays { position: absolute; inset: 0; overflow: hidden; }
    .map-tiles img { position: absolute; width: 256px; height: 256px; max-width: none; user-select: none; pointer-events: none; }
    .map-overlays { pointer-events: none; z-index: 2; }
    .map-marker { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid #fff; border-radius: 999px; background: #1769aa; color: #fff; font-size: 12px; font-weight: 700; box-shadow: 0 1px 5px #0006; }
    .map-marker.completed { background: #68727d; }
    .map-location-marker { width: 18px; height: 18px; background: #d63b2f; border-width: 3px; box-shadow: 0 0 0 5px #d63b2f33; }
    .map-controls { position: absolute; top: 10px; right: 10px; z-index: 4; display: flex; gap: 6px; }
    .map-controls button { min-width: 42px; background: #fff; }
    .map-attribution { position: absolute; right: 4px; bottom: 3px; z-index: 4; padding: 2px 5px; border-radius: 4px; background: #ffffffe6; color: #345; font-size: 11px; text-decoration: none; }
    @media (max-width: 720px) { .grid, .context-grid { grid-template-columns: 1fr; } main { padding: 12px; } .trip-map { height: 300px; } }
  </style>
</head>
<body></body>
</html>
