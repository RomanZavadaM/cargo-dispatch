[package]
name = "cargo-dispatch-planner-desktop"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
cargo-dispatch-contracts = { path = "../../../crates/contracts" }
cargo-dispatch-domain = { path = "../../../crates/domain" }
cargo-dispatch-geo = { path = "../../../crates/geo" }
cargo-dispatch-planner = { path = "../../../crates/planner" }
cargo-dispatch-planner-ui-contracts = { path = "../../../crates/planner-ui-contracts" }
cargo-dispatch-trip-files = { path = "../../../crates/trip-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "=2.12.7"
tauri-plugin-dialog = "=2.8.4"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
