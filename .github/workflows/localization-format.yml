name: Format localization branch

on:
  push:
    branches:
      - "product/localization-r1"
    paths:
      - "apps/control-ui/src/**"
      - ".github/workflows/localization-format.yml"

permissions:
  contents: write

concurrency:
  group: localization-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: product/localization-r1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-ui/src
          git commit -m "Format Control localization sources"
          git push origin HEAD:product/localization-r1
