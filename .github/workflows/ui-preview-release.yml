name: Publish UI preview

on:
  push:
    branches:
      - "prototype/ui-r1"
    paths:
      - ".github/workflows/ui-preview-release.yml"

permissions:
  contents: write

env:
  PREVIEW_TAG: "v0.1.0-preview.2"
  PREVIEW_NAME: "Cargo Dispatch UI Preview 0.2"

jobs:
  windows-preview:
    name: Build Windows preview
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.2

      - name: Build browser UI
        working-directory: apps/leptos-web
        run: trunk build --release=true

      - name: Build Windows portable preview
        run: cargo build --locked --release -p ui-probe-tauri

      - name: Prepare preview packages
        shell: pwsh
        run: |
          $windowsRoot = "preview/Cargo-Dispatch-UI-Preview-0.2-Windows-x64"
          $browserRoot = "preview/Cargo-Dispatch-UI-Preview-0.2-Browser"
          New-Item -ItemType Directory -Force $windowsRoot | Out-Null
          New-Item -ItemType Directory -Force $browserRoot | Out-Null
          Copy-Item target/release/ui-probe-tauri.exe "$windowsRoot/Cargo-Dispatch-UI-Preview.exe"
          Copy-Item LICENSE.md "$windowsRoot/LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "$windowsRoot/THIRD_PARTY_NOTICES.md"
          Copy-Item README.md "$windowsRoot/README.md"
          Copy-Item apps/leptos-web/dist/* $browserRoot -Recurse
          Copy-Item LICENSE.md "$browserRoot/LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "$browserRoot/THIRD_PARTY_NOTICES.md"
          @"
          Cargo Dispatch UI Preview 0.2

          Це тестовий попередній перегляд інтерфейсу, а не стабільний реліз.

          Уже можна подивитися:
          - пул із 5 000 синтетичних заявок;
          - пошук, сортування, вибір і відкриття заявки;
          - велику форму заявки;
          - телефонний/ручний режим;
          - попередження про незбережені зміни;
          - робочий маршрут;
          - карту з варіантами маршруту та ручною точкою;
          - тестові межі команд desktop-програми;
          - перемикання української/англійської/німецької;
          - клавіатурне керування та перевірені стани закриття/незбережених змін;
          - окремий браузерний екран водія з документами, геолокацією та переходом у навігатор;
          - обробку типових помилок без втрати робочого стану.

          Дані синтетичні. Нове planner/control ядро розробляється окремо і в цей UI preview ще не інтегроване. Реальної бази, реальних замовлень і польового мобільного зв'язку у цьому preview немає.
          "@ | Set-Content -Encoding UTF8 "$windowsRoot/START_HERE.txt"
          Compress-Archive -Path $windowsRoot -DestinationPath Cargo-Dispatch-UI-Preview-0.2-Windows-x64.zip -Force
          Compress-Archive -Path $browserRoot -DestinationPath Cargo-Dispatch-UI-Preview-0.2-Browser.zip -Force
          $winHash = (Get-FileHash Cargo-Dispatch-UI-Preview-0.2-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          $webHash = (Get-FileHash Cargo-Dispatch-UI-Preview-0.2-Browser.zip -Algorithm SHA256).Hash.ToLower()
          "$winHash  Cargo-Dispatch-UI-Preview-0.2-Windows-x64.zip" | Set-Content -Encoding ASCII SHA256SUMS.txt
          "$webHash  Cargo-Dispatch-UI-Preview-0.2-Browser.zip" | Add-Content -Encoding ASCII SHA256SUMS.txt

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Що це

          Другий тестовий перегляд інтерфейсу Cargo Dispatch. Це не стабільна версія і не готова диспетчерська система.

          ### Уже є
          - пул 5 000 синтетичних заявок;
          - пошук, сортування, вибір і відкриття;
          - велика форма заявки з ручним і телефонним режимами;
          - перевірка введених даних, збереження/скасування та захист незбережених змін;
          - робочий маршрут із захищеними точками;
          - карта з трьома варіантами маршруту і ручною точкою;
          - підготовлена межа між екраном та внутрішньою логікою desktop-програми;
          - українська, англійська та німецька локалізації;
          - клавіатурна навігація, фокус, закриття вікон і захист незбережених змін;
          - окрема браузерна сторінка водія;
          - тестові сценарії документів, геолокації, переходу в навігатор і помилок;
          - повний UI probe P01–P15 пройдений.

          ### Що ще не є готовим продуктом
          - немає справжньої робочої бази заявок;
          - нове planner/control ядро розробляється окремо й у цей preview ще не інтегроване;
          - немає польового тесту телефона через реальний VPS/NAT/CGNAT;
          - вигляд ще тестовий і буде змінюватися.

          Windows: розпакувати ZIP. Усередині буде окрема папка Cargo-Dispatch-UI-Preview-0.2-Windows-x64; відкрити її і запустити Cargo-Dispatch-UI-Preview.exe.
          "@
          if (gh release view $env:PREVIEW_TAG --repo "${{ github.repository }}" *> $null) {
            gh release edit $env:PREVIEW_TAG --repo "${{ github.repository }}" --title $env:PREVIEW_NAME --notes $notes --prerelease
          } else {
            gh release create $env:PREVIEW_TAG --repo "${{ github.repository }}" --target "${{ github.sha }}" --title $env:PREVIEW_NAME --notes $notes --prerelease
          }
          gh release upload $env:PREVIEW_TAG Cargo-Dispatch-UI-Preview-0.2-Windows-x64.zip Cargo-Dispatch-UI-Preview-0.2-Browser.zip SHA256SUMS.txt --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-dispatch-ui-preview-0.2
          path: |
            Cargo-Dispatch-UI-Preview-0.2-Windows-x64.zip
            Cargo-Dispatch-UI-Preview-0.2-Browser.zip
            SHA256SUMS.txt
          if-no-files-found: error
