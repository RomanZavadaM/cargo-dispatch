name: Control desktop product UI

on:
  push:
    branches:
      - "product/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/control-ui-contracts/**"
      - "crates/control-web/**"
      - "crates/trip-files/**"
      - "apps/control-ui/**"
      - "apps/control-desktop/**"
      - "deny.toml"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/control-desktop.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/control-ui-contracts/**"
      - "crates/control-web/**"
      - "crates/trip-files/**"
      - "apps/control-ui/**"
      - "apps/control-desktop/**"
      - "deny.toml"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/control-desktop.yml"

permissions:
  contents: read

concurrency:
  group: control-desktop-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: "0.22.2"

jobs:
  browser:
    name: Control Leptos frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Control frontend
        working-directory: apps/control-ui
        run: trunk build --release=true

      - name: Verify frontend output
        run: |
          test -s apps/control-ui/dist/index.html
          find apps/control-ui/dist -maxdepth 1 -type f -print

  desktop:
    name: Control Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          components: rustfmt, clippy

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check desktop shell
        run: cargo check --locked -p cargo-dispatch-control-desktop --all-targets

      - name: Clippy desktop shell
        run: cargo clippy --locked -p cargo-dispatch-control-desktop --all-targets -- -D warnings

      - name: Test desktop service
        run: cargo test --locked -p cargo-dispatch-control-desktop --all-targets


  windows-artifact:
    name: Windows loopback manual test artifact
    runs-on: windows-latest
    needs:
      - browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Control frontend
        working-directory: apps/control-ui
        run: trunk build --release=true

      - name: Build Control test executable
        run: cargo build --locked -p cargo-dispatch-control-desktop --release

      - name: Create synthetic local test trip
        run: cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- local-browser-test-data

      - name: Write local test instructions
        shell: pwsh
        run: |
          @"
          Cargo Dispatch Control — local Driver Browser test

          1. Run cargo-dispatch-control-desktop.exe.
          2. Select local-browser-test-data\active-trip and connect it.
          3. Start "Локально 127.0.0.1".
          4. Open the Driver URL shown by Control in a normal browser.
          5. Test the same URL at wide desktop/laptop, tablet and narrow phone viewport widths.
          6. Use local-browser-test-data\sample-control-to-driver.pdf for Control -> Browser PDF.
             Then send any local file/photo/video from Browser -> Control and save it from Control.
          7. Check route reorder in both directions, two browser clients, and refresh/reconnect.
          8. Check the real OpenStreetMap view in both Control and Driver Browser: pan/zoom/fit,
             route-point markers and the latest accepted driver position.
          9. The map currently shows points/position, not Valhalla road geometry.

          This is a CI test artifact, not a release.
          "@ | Set-Content -Encoding UTF8 LOCAL_BROWSER_TEST.txt

      - name: Upload Windows manual test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Control-local-browser-Windows-x64
          path: |
            target/release/cargo-dispatch-control-desktop.exe
            LOCAL_BROWSER_TEST.txt
            THIRD_PARTY_NOTICES.md
            local-browser-test-data/**
          if-no-files-found: error
          retention-days: 7
