name: Driver Android

on:
  push:
    branches:
      - "product/driver-android-r1"
    paths:
      - "apps/driver-android/**"
      - ".github/workflows/driver-android.yml"
  pull_request:
    paths:
      - "apps/driver-android/**"
      - ".github/workflows/driver-android.yml"

permissions:
  contents: read

concurrency:
  group: driver-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37"

      - name: Unit tests and debug APK
        working-directory: apps/driver-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-Android-debug
          path: apps/driver-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
