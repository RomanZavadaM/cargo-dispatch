name: Driver Android

on:
  push:
    branches:
      - "product/driver-android-r*"
    paths:
      - "apps/driver-android/**"
      - "crates/control-web/**"
      - "crates/trip-files/**"
      - ".github/workflows/driver-android.yml"
  pull_request:
    paths:
      - "apps/driver-android/**"
      - "crates/control-web/**"
      - "crates/trip-files/**"
      - ".github/workflows/driver-android.yml"

permissions:
  contents: read

concurrency:
  group: driver-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests and debug APK
        working-directory: apps/driver-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-Android-debug
          path: apps/driver-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  emulator-smoke:
    name: Android Emulator smoke
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"

      - name: Prepare real Control smoke session
        run: |
          cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- native-smoke-data
          cargo build --locked -p cargo-dispatch-control-web --example native_smoke_server

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Driver-Android-debug
          path: android-apk

      - name: Install, launch and screenshot in Android Emulator
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            target/debug/examples/native_smoke_server               native-smoke-data/synthetic-trip-package.zip               native-smoke-session-00000001               > native-smoke.log 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

            for _ in $(seq 1 80); do
              if grep -q '^CARGO_DISPATCH_SMOKE_ANDROID_URL=' native-smoke.log; then
                break
              fi
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                cat native-smoke.log
                exit 1
              fi
              sleep 0.25
            done
            cat native-smoke.log
            ANDROID_DRIVER_URL="$(sed -n 's/^CARGO_DISPATCH_SMOKE_ANDROID_URL=//p' native-smoke.log | tail -n 1)"
            test -n "$ANDROID_DRIVER_URL"

            adb install -r android-apk/app-debug.apk
            adb shell am start -W               -n com.romanzavada.cargodispatch.driver/.MainActivity               --es cargo_dispatch_driver_url "$ANDROID_DRIVER_URL"               --ez cargo_dispatch_emulator_mode true

            CONNECTED=0
            for _ in $(seq 1 40); do
              adb shell uiautomator dump /sdcard/cargo-driver-window.xml >/dev/null 2>&1 || true
              adb exec-out cat /sdcard/cargo-driver-window.xml > android-driver-window.xml 2>/dev/null || true
              if grep -q '41414141' android-driver-window.xml; then
                CONNECTED=1
                break
              fi
              sleep 1
            done

            if [ "$CONNECTED" -ne 1 ]; then
              cat android-driver-window.xml || true
              adb logcat -d -t 300 || true
              exit 1
            fi

            adb exec-out screencap -p > android-driver-smoke.png
            adb shell am force-stop com.romanzavada.cargodispatch.driver

      - name: Upload Android smoke screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-Android-smoke
          path: android-driver-smoke.png
          if-no-files-found: error
