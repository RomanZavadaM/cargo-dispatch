name: Driver Android

on:
  push:
    branches:
      - "product/driver-android-r1"
    paths:
      - "apps/driver-android/**"
      - ".github/workflows/driver-android.yml"
  pull_request:
    paths:
      - "apps/driver-android/**"
      - ".github/workflows/driver-android.yml"

permissions:
  contents: read

concurrency:
  group: driver-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests and debug APK
        working-directory: apps/driver-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-Android-debug
          path: apps/driver-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  emulator-smoke:
    name: Android Emulator smoke
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Driver-Android-debug
          path: android-apk

      - name: Install, launch and screenshot in Android Emulator
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-apk/app-debug.apk
            adb shell am start -W -n com.romanzavada.cargodispatch.driver/.MainActivity
            sleep 3
            adb exec-out screencap -p > android-driver-smoke.png
            adb shell am force-stop com.romanzavada.cargodispatch.driver

      - name: Upload Android smoke screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-Android-smoke
          path: android-driver-smoke.png
          if-no-files-found: error
