name: Publish product preview

on:
  push:
    branches:
      - main
    paths:
      - ".release-preview"

permissions:
  contents: write

concurrency:
  group: publish-product-preview
  cancel-in-progress: false

jobs:
  android-preview:
    name: Build Android preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Test and build Android Driver
        working-directory: apps/driver-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Stage Android release asset
        shell: bash
        run: |
          TAG="$(tr -d '\r\n' < .release-preview)"
          test -n "$TAG"
          cp apps/driver-android/app/build/outputs/apk/debug/app-debug.apk             "Cargo-Dispatch-Driver-$TAG-Android-debug.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Preview-Android
          path: Cargo-Dispatch-Driver-*-Android-debug.apk
          if-no-files-found: error

  apple-preview:
    name: Build Apple Simulator preview
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Core protocol tests
        run: swift test --package-path apps/driver-ios

      - name: Build iPhone/iPad Simulator app
        run: |
          xcodebuild             -project apps/driver-ios/CargoDispatchDriver.xcodeproj             -scheme CargoDispatchDriver             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath apps/driver-ios/build/DerivedData             CODE_SIGNING_ALLOWED=YES             CODE_SIGN_IDENTITY=-             build

      - name: Verify Apple Simulator signature
        shell: bash
        run: |
          APP="apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app"
          test -d "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1
          codesign --verify --deep --strict "$APP"

      - name: Stage Apple Simulator release asset
        shell: bash
        run: |
          TAG="$(tr -d '\r\n' < .release-preview)"
          APP="apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app"
          PACKAGE="Cargo-Dispatch-Driver-$TAG-iOS-Simulator"
          test -d "$APP"
          mkdir -p "$PACKAGE"
          ditto "$APP" "$PACKAGE/CargoDispatchDriver.app"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE" "$PACKAGE.zip"
          unzip -Z1 "$PACKAGE.zip" | grep -q "^$PACKAGE/"

      - name: Upload Apple Simulator release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Preview-Apple
          path: Cargo-Dispatch-Driver-*-iOS-Simulator.zip
          if-no-files-found: error

  macos-preview:
    name: Build macOS Control preview
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Add both macOS Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Control frontend
        working-directory: apps/control-ui
        run: trunk build --release=true

      - name: Build universal macOS Control executable
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p cargo-dispatch-control-desktop --release --target x86_64-apple-darwin
          cargo build --locked -p cargo-dispatch-control-desktop --release --target aarch64-apple-darwin
          lipo -create             target/x86_64-apple-darwin/release/cargo-dispatch-control-desktop             target/aarch64-apple-darwin/release/cargo-dispatch-control-desktop             -output Cargo-Dispatch-Control
          chmod +x Cargo-Dispatch-Control
          lipo -info Cargo-Dispatch-Control

      - name: Create synthetic acceptance data
        run: cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- local-browser-test-data

      - name: Stage macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < .release-preview)"
          PACKAGE="Cargo-Dispatch-Control-$TAG-macOS-universal"
          APP="$PACKAGE/Cargo Dispatch Control.app"
          mkdir -p "$APP/Contents/MacOS"
          cp Cargo-Dispatch-Control "$APP/Contents/MacOS/Cargo-Dispatch-Control"
          cp THIRD_PARTY_NOTICES.md "$PACKAGE/THIRD_PARTY_NOTICES.md"
          cp -R local-browser-test-data "$PACKAGE/local-browser-test-data"

          python3 - "$APP/Contents/Info.plist" "$TAG" <<'PY'
          import plistlib, sys
          path, tag = sys.argv[1:]
          info = {
              "CFBundleDevelopmentRegion": "uk",
              "CFBundleDisplayName": "Cargo Dispatch Control",
              "CFBundleExecutable": "Cargo-Dispatch-Control",
              "CFBundleIdentifier": "ua.cargodispatch.control",
              "CFBundleInfoDictionaryVersion": "6.0",
              "CFBundleName": "Cargo Dispatch Control",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": tag.removeprefix("v"),
              "CFBundleVersion": "1",
              "LSMinimumSystemVersion": "12.0",
              "NSHighResolutionCapable": True,
          }
          with open(path, "wb") as handle:
              plistlib.dump(info, handle)
          PY

          cat > "$PACKAGE/README-TEST.txt" <<'EOF'
          Cargo Dispatch Control — macOS universal test build

          This is a test/pre-release build, not a signed/notarized stable product.
          The .app contains a universal Intel + Apple Silicon executable.

          Open Cargo Dispatch Control.app. If macOS blocks an unsigned test build,
          use Finder -> right click -> Open for this local test build.

          Use local-browser-test-data for the same Control/Driver Browser acceptance
          as on Windows. Store signing/notarization will be handled later.
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE" "$PACKAGE.zip"

      - name: Upload macOS Control release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Preview-macOS
          path: Cargo-Dispatch-Control-*-macOS-universal.zip
          if-no-files-found: error

  linux-control-preview:
    name: Build Linux Control preview
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Install Linux Tauri dependencies
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Control frontend
        working-directory: apps/control-ui
        run: trunk build --release=true

      - name: Build Linux Control executable
        run: cargo build --locked -p cargo-dispatch-control-desktop --release

      - name: Create synthetic acceptance data
        run: cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- local-browser-test-data

      - name: Stage Linux Control package
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < .release-preview)"
          PACKAGE="Cargo-Dispatch-Control-$TAG-Linux-x64"
          mkdir -p "$PACKAGE"
          cp target/release/cargo-dispatch-control-desktop "$PACKAGE/Cargo-Dispatch-Control"
          chmod +x "$PACKAGE/Cargo-Dispatch-Control"
          cp THIRD_PARTY_NOTICES.md "$PACKAGE/THIRD_PARTY_NOTICES.md"
          cp -R local-browser-test-data "$PACKAGE/local-browser-test-data"
          cat > "$PACKAGE/README-TEST.txt" <<'EOF'
          Cargo Dispatch Control — Linux x64 preview

          Run ./Cargo-Dispatch-Control from a desktop Linux session.
          This portable package is for product testing; distro-specific
          installers/packages can be added later.
          EOF
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - name: Upload Linux Control release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Preview-Control-Linux
          path: Cargo-Dispatch-Control-*-Linux-x64.tar.gz
          if-no-files-found: error


  macos-planner-preview:
    name: Build macOS Planner preview
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Add both macOS Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Planner frontend
        working-directory: apps/planner-ui
        run: trunk build --release=true

      - name: Test Planner service
        run: cargo test --locked -p cargo-dispatch-planner-desktop --all-targets

      - name: Build universal macOS Planner executable
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p cargo-dispatch-planner-desktop --release --target x86_64-apple-darwin
          cargo build --locked -p cargo-dispatch-planner-desktop --release --target aarch64-apple-darwin
          lipo -create             target/x86_64-apple-darwin/release/cargo-dispatch-planner-desktop             target/aarch64-apple-darwin/release/cargo-dispatch-planner-desktop             -output Cargo-Dispatch-Planner
          chmod +x Cargo-Dispatch-Planner
          lipo -info Cargo-Dispatch-Planner

      - name: Stage macOS Planner app bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < .release-preview)"
          PACKAGE="Cargo-Dispatch-Planner-$TAG-macOS-universal"
          APP="$PACKAGE/Cargo Dispatch Planner.app"
          mkdir -p "$APP/Contents/MacOS"
          cp Cargo-Dispatch-Planner "$APP/Contents/MacOS/Cargo-Dispatch-Planner"
          cp THIRD_PARTY_NOTICES.md "$PACKAGE/THIRD_PARTY_NOTICES.md"

          python3 - "$APP/Contents/Info.plist" "$TAG" <<'PY'
          import plistlib, sys
          path, tag = sys.argv[1:]
          info = {
              "CFBundleDevelopmentRegion": "uk",
              "CFBundleDisplayName": "Cargo Dispatch Planner",
              "CFBundleExecutable": "Cargo-Dispatch-Planner",
              "CFBundleIdentifier": "ua.cargodispatch.planner",
              "CFBundleInfoDictionaryVersion": "6.0",
              "CFBundleName": "Cargo Dispatch Planner",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": tag.removeprefix("v"),
              "CFBundleVersion": "1",
              "LSMinimumSystemVersion": "12.0",
              "NSHighResolutionCapable": True,
          }
          with open(path, "wb") as handle:
              plistlib.dump(info, handle)
          PY

          cat > "$PACKAGE/README-TEST.txt" <<'EOF'
          Cargo Dispatch Planner — macOS universal preview

          First Planner desktop slice: manual route draft with point add/remove/reorder,
          navigation coordinates, core-owned revision and 8 UI languages.

          This test build keeps the draft in process memory only. Durable Planner draft
          persistence, routing preview and package export are later slices.
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE" "$PACKAGE.zip"

      - name: Upload macOS Planner release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Preview-Planner-macOS
          path: Cargo-Dispatch-Planner-*-macOS-universal.zip
          if-no-files-found: error

  linux-planner-preview:
    name: Build Linux Planner preview
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Install Linux Tauri dependencies
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev             libappindicator3-dev             librsvg2-dev             patchelf             xdg-utils

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Planner frontend
        working-directory: apps/planner-ui
        run: trunk build --release=true

      - name: Test Planner service
        run: cargo test --locked -p cargo-dispatch-planner-desktop --all-targets

      - name: Build Linux Planner executable
        run: cargo build --locked -p cargo-dispatch-planner-desktop --release

      - name: Stage Linux Planner package
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < .release-preview)"
          PACKAGE="Cargo-Dispatch-Planner-$TAG-Linux-x64"
          mkdir -p "$PACKAGE"
          cp target/release/cargo-dispatch-planner-desktop "$PACKAGE/Cargo-Dispatch-Planner"
          chmod +x "$PACKAGE/Cargo-Dispatch-Planner"
          cp THIRD_PARTY_NOTICES.md "$PACKAGE/THIRD_PARTY_NOTICES.md"
          cat > "$PACKAGE/README-TEST.txt" <<'EOF'
          Cargo Dispatch Planner — Linux x64 preview

          First Planner desktop slice: manual route draft with point add/remove/reorder,
          navigation coordinates, core-owned revision and 8 UI languages.

          This test build keeps the draft in process memory only. Durable Planner draft
          persistence, routing preview and package export are later slices.
          EOF
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - name: Upload Linux Planner release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Preview-Planner-Linux
          path: Cargo-Dispatch-Planner-*-Linux-x64.tar.gz
          if-no-files-found: error

  gateway-preview:
    name: Build Linux Addressing Gateway preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Test and build gateway
        run: |
          cargo test --locked -p cargo-dispatch-addressing-gateway --all-targets
          cargo build --locked -p cargo-dispatch-addressing-gateway --release

      - name: Stage gateway release package
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < .release-preview)"
          PACKAGE="Cargo-Dispatch-Gateway-$TAG-Linux-x64"
          mkdir -p "$PACKAGE"
          cp target/release/cargo-dispatch-addressing-gateway "$PACKAGE/"
          cp deploy/addressing-gateway/Dockerfile "$PACKAGE/"
          cp deploy/addressing-gateway/docker-compose.example.yml "$PACKAGE/"
          cp deploy/addressing-gateway/README.md "$PACKAGE/README.md"
          cp crates/addressing-gateway/README.md "$PACKAGE/PROTOCOL.md"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - name: Upload gateway release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Preview-Gateway
          path: Cargo-Dispatch-Gateway-*-Linux-x64.tar.gz
          if-no-files-found: error

  windows-preview:
    name: Build and publish product preview
    needs:
      - android-preview
      - apple-preview
      - macos-preview
      - linux-control-preview
      - macos-planner-preview
      - linux-planner-preview
      - gateway-preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Preview-Android
          path: mobile-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Preview-Apple
          path: mobile-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Preview-macOS
          path: desktop-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Preview-Control-Linux
          path: desktop-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Preview-Planner-macOS
          path: planner-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Preview-Planner-Linux
          path: planner-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Preview-Gateway
          path: server-assets

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Control frontend
        working-directory: apps/control-ui
        run: trunk build --release=true

      - name: Build Control Windows executable
        run: cargo build --locked -p cargo-dispatch-control-desktop --release

      - name: Build Planner frontend
        working-directory: apps/planner-ui
        run: trunk build --release=true

      - name: Test Planner service
        run: cargo test --locked -p cargo-dispatch-planner-desktop --all-targets

      - name: Build Planner Windows executable
        run: cargo build --locked -p cargo-dispatch-planner-desktop --release

      - name: Create synthetic acceptance data
        run: cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- local-browser-test-data

      - name: Read release tag
        shell: pwsh
        run: |
          $tag = (Get-Content ".release-preview" -Raw).Trim()
          if (-not $tag.StartsWith("v0.1.0-preview.")) {
            throw "Unexpected preview tag: $tag"
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage preview package and checksums
        shell: pwsh
        run: |
          $packageName = "Cargo-Dispatch-Control-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Force $packageName | Out-Null
          Copy-Item "target/release/cargo-dispatch-control-desktop.exe" "$packageName/Cargo-Dispatch-Control.exe"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$packageName/THIRD_PARTY_NOTICES.md"
          Copy-Item "local-browser-test-data" "$packageName/local-browser-test-data" -Recurse
          @"
          Cargo Dispatch $env:TAG — Windows preview

          This is a test/pre-release build, not a stable product.

          Local Driver Browser test:
          1. Run Cargo-Dispatch-Control.exe.
          2. Select local-browser-test-data\active-trip and connect it.
          3. Start "Локально 127.0.0.1".
          4. Open the Driver URL shown by Control in a normal browser.
          5. Test wide desktop/laptop, tablet and narrow phone layouts.
          6. Check route reorder both ways, files/PDF, Browser -> Control photo/video/file + Save,
             two browser clients, refresh/reconnect and maps in Control/Driver Browser.

          Versioned schema 1.3 road geometry, runtime Valhalla configuration and live
          recalculation after reorder are included. Real-world HTTPS/NAT/CGNAT field acceptance
          remains separate field work.
          "@ | Set-Content -Encoding UTF8 "$packageName/README-TEST.txt"

          $windowsZip = "$packageName.zip"
          Compress-Archive -Path "$packageName" -DestinationPath $windowsZip -CompressionLevel Optimal
          $windowsEntries = tar -tf $windowsZip
          if (-not ($windowsEntries | Where-Object { $_ -like "$packageName/*" })) {
            throw "Windows archive must contain the versioned package root folder: $packageName"
          }

          $plannerPackage = "Cargo-Dispatch-Planner-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Force $plannerPackage | Out-Null
          Copy-Item "target/release/cargo-dispatch-planner-desktop.exe" "$plannerPackage/Cargo-Dispatch-Planner.exe"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$plannerPackage/THIRD_PARTY_NOTICES.md"
          @"
          Cargo Dispatch Planner $env:TAG — Windows preview

          First Planner desktop slice: manual route draft with point add/remove/reorder,
          navigation coordinates, core-owned revision and 8 UI languages.

          This test build keeps the draft in process memory only. Durable Planner draft
          persistence, routing preview and package export are later slices.
          "@ | Set-Content -Encoding UTF8 "$plannerPackage/README-TEST.txt"
          $plannerWindowsZip = "$plannerPackage.zip"
          Compress-Archive -Path "$plannerPackage" -DestinationPath $plannerWindowsZip -CompressionLevel Optimal
          $plannerEntries = tar -tf $plannerWindowsZip
          if (-not ($plannerEntries | Where-Object { $_ -like "$plannerPackage/*" })) {
            throw "Planner Windows archive must contain the versioned package root folder: $plannerPackage"
          }

          $android = Get-ChildItem "mobile-assets/Cargo-Dispatch-Driver-*-Android-debug.apk" | Select-Object -First 1
          $apple = Get-ChildItem "mobile-assets/Cargo-Dispatch-Driver-*-iOS-Simulator.zip" | Select-Object -First 1
          $macos = Get-ChildItem "desktop-assets/Cargo-Dispatch-Control-*-macOS-universal.zip" | Select-Object -First 1
          $linux = Get-ChildItem "desktop-assets/Cargo-Dispatch-Control-*-Linux-x64.tar.gz" | Select-Object -First 1
          $gateway = Get-ChildItem "server-assets/Cargo-Dispatch-Gateway-*-Linux-x64.tar.gz" | Select-Object -First 1
          $plannerMacos = Get-ChildItem "planner-assets/Cargo-Dispatch-Planner-*-macOS-universal.zip" | Select-Object -First 1
          $plannerLinux = Get-ChildItem "planner-assets/Cargo-Dispatch-Planner-*-Linux-x64.tar.gz" | Select-Object -First 1
          if (-not $android -or -not $apple -or -not $macos -or -not $linux -or -not $gateway -or -not $plannerMacos -or -not $plannerLinux) {
            throw "Required release assets are missing"
          }
          Copy-Item $android.FullName $android.Name
          Copy-Item $apple.FullName $apple.Name
          Copy-Item $macos.FullName $macos.Name
          Copy-Item $linux.FullName $linux.Name
          Copy-Item $gateway.FullName $gateway.Name
          Copy-Item $plannerMacos.FullName $plannerMacos.Name
          Copy-Item $plannerLinux.FullName $plannerLinux.Name

          function Assert-VersionedArchiveRoot([string]$ArchivePath) {
            $leaf = Split-Path $ArchivePath -Leaf
            if ($leaf.EndsWith(".tar.gz")) {
              $expectedRoot = $leaf.Substring(0, $leaf.Length - 7)
            } elseif ($leaf.EndsWith(".zip")) {
              $expectedRoot = $leaf.Substring(0, $leaf.Length - 4)
            } else {
              throw "Unsupported archive type for root-folder validation: $leaf"
            }
            $entries = @(tar -tf $ArchivePath | Where-Object { $_ -and $_ -ne "./" })
            if ($entries.Count -eq 0) {
              throw "Archive is empty: $leaf"
            }
            $bad = @($entries | Where-Object {
              $normalized = $_ -replace "\\", "/"
              -not ($normalized -eq $expectedRoot -or $normalized.StartsWith("$expectedRoot/"))
            })
            if ($bad.Count -gt 0) {
              throw "Archive $leaf must contain only one versioned root folder '$expectedRoot'. Unexpected entry: $($bad[0])"
            }
          }

          @($windowsZip, $plannerWindowsZip, $macos.Name, $linux.Name, $plannerMacos.Name, $plannerLinux.Name, $apple.Name, $gateway.Name) | ForEach-Object {
            Assert-VersionedArchiveRoot $_
          }

          @($windowsZip, $plannerWindowsZip, $macos.Name, $linux.Name, $plannerMacos.Name, $plannerLinux.Name, $android.Name, $apple.Name, $gateway.Name) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Підготувати опис тестового релізу
        shell: pwsh
        run: |
          @"
          ## Що це

          Cargo Dispatch $env:TAG — інтегрована тестова версія поточного продукту. Це **попередній реліз**, не стабільна версія.

          ### Збірки в релізі
          - Windows Control x64 ZIP;
          - macOS Control universal ZIP (Intel + Apple Silicon);
          - Linux Control x64 tar.gz;
          - Windows Planner x64 ZIP;
          - macOS Planner universal ZIP (Intel + Apple Silicon);
          - Linux Planner x64 tar.gz;
          - Android Driver debug APK для тестового встановлення;
          - iOS/iPadOS Driver Simulator ZIP для тестування в Apple Simulator;
          - Linux Addressing Gateway x64 tar.gz із Docker/Compose deployment files.

          Android та Apple assets поки тестові й не підписані для магазинів. App Store/TestFlight/Google Play signing і distribution будуть опрацьовані окремо пізніше.

          ### Уже в цьому preview
          - Control desktop на Rust/Tauri + Leptos;
          - окремий Planner desktop на Rust/Tauri + Leptos для Windows/macOS/Linux;
          - чернетка ручного маршруту в Planner: додавання, видалення й перестановка точок, координати навігації, ревізії через ядро Planner, 8 мов;
          - постійне локальне збереження активного рейсу та відновлення після перезапуску;
          - адаптивний Driver Browser для телефона, планшета та широкого desktop/ноутбук режиму;
          - зміна порядку відкритих точок;
          - документи, фото, відео та геолокація;
          - інтерактивні карти;
          - адаптер Valhalla, дорожня геометрія schema 1.3 + фактичний профіль маршрутизації автомобіля; старі schema 1.0–1.2 залишаються читабельними;
          - налаштування адреси Valhalla, набору карт і таймаутів у Desktop Control та живий перерахунок геометрії після зміни порядку точок;
          - нативні Android та iOS/iPadOS Driver і тестові збірки з того самого коду релізу;
          - сервер Addressing Gateway для публічного зв'язку Control ↔ Driver без зберігання рейсу на сервері.

          ### Що ще попереду
          - перевірка на реальних Android/iPhone у локальній мережі та перевірка фонового відстеження;
          - HTTPS і публічна адресація;
          - польова перевірка через NAT/CGNAT;
          - підпис мобільних застосунків для production, TestFlight і Google Play;

          Control Windows: розпакувати ZIP і запустити Cargo-Dispatch-Control.exe.
          Control macOS: розпакувати universal ZIP і відкрити Cargo Dispatch Control.app; підпис/notarization буде пізніше.
          Control Linux: розпакувати tar.gz і запустити ./Cargo-Dispatch-Control у desktop Linux session.
          Planner Windows: розпакувати Planner ZIP і запустити Cargo-Dispatch-Planner.exe.
          Planner macOS: розпакувати Planner universal ZIP і відкрити Cargo Dispatch Planner.app.
          Planner Linux: розпакувати Planner tar.gz і запустити ./Cargo-Dispatch-Planner.
          Android: встановити debug APK вручну на тестовий пристрій.
          Apple: Simulator ZIP призначений для Apple Simulator, не для фізичного iPhone/iPad.
          Gateway: розпакувати Linux tar.gz або використати Docker/Compose files; HTTPS ставиться reverse proxy перед gateway.
          "@ | Set-Content -Encoding UTF8 RELEASE_NOTES.md

      - name: Опублікувати тестовий реліз у GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $android = (Get-ChildItem "Cargo-Dispatch-Driver-*-Android-debug.apk" | Select-Object -First 1).Name
          $apple = (Get-ChildItem "Cargo-Dispatch-Driver-*-iOS-Simulator.zip" | Select-Object -First 1).Name
          $macos = (Get-ChildItem "Cargo-Dispatch-Control-*-macOS-universal.zip" | Select-Object -First 1).Name
          $linux = (Get-ChildItem "Cargo-Dispatch-Control-*-Linux-x64.tar.gz" | Select-Object -First 1).Name
          $gateway = (Get-ChildItem "Cargo-Dispatch-Gateway-*-Linux-x64.tar.gz" | Select-Object -First 1).Name
          $plannerMacos = (Get-ChildItem "Cargo-Dispatch-Planner-*-macOS-universal.zip" | Select-Object -First 1).Name
          $plannerLinux = (Get-ChildItem "Cargo-Dispatch-Planner-*-Linux-x64.tar.gz" | Select-Object -First 1).Name
          gh release create "$env:TAG" `
            --repo "${{ github.repository }}" `
            --target "$env:GITHUB_SHA" `
            --title "Cargo Dispatch $env:TAG — тестова версія" `
            --notes-file RELEASE_NOTES.md `
            --prerelease `
            "Cargo-Dispatch-Control-$env:TAG-Windows-x64.zip" `
            "Cargo-Dispatch-Planner-$env:TAG-Windows-x64.zip" `
            "$macos" `
            "$linux" `
            "$plannerMacos" `
            "$plannerLinux" `
            "$android" `
            "$apple" `
            "$gateway" `
            "SHA256SUMS.txt"
