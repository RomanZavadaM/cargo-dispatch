name: Routing prototype

on:
  push:
    branches:
      - "prototype/routing-r1"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/geo-probe/**"
      - "probe/**"
      - "deny.toml"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/routing-probe.yml"

permissions:
  contents: read

concurrency:
  group: routing-${{ github.ref }}
  cancel-in-progress: true

env:
  VALHALLA_VERSION: "3.9.3"
  VALHALLA_IMAGE: "ghcr.io/valhalla/valhalla@sha256:cf618ccafdead96829282acc81a70aa00947c2f28ddcf118f0194acf2fbc7e9d"

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets
      - name: Install dependency checker
        run: cargo install cargo-deny --locked --version 0.22.0
      - name: Check dependency licenses and advisories
        run: cargo deny check licenses advisories bans sources

  msrv:
    name: MSRV 1.91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - name: Check declared minimum Rust
        run: cargo check --locked --workspace --all-targets

  cross-platform:
    name: Cross-platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

  fixture:
    name: Synthetic fixture + pinned Valhalla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils osmium-tool

      - name: Validate and convert synthetic OSM fixture
        run: |
          set -euo pipefail
          mkdir -p probe/out
          xmllint --noout probe/fixture/routing.osm
          osmium cat probe/fixture/routing.osm -o probe/out/routing.osm.pbf --overwrite
          sha256sum probe/fixture/routing.osm | tee probe/out/fixture.sha256
          osmium --version | head -n 1 | tee probe/out/osmium-version.txt

      - name: Pull exact Valhalla image
        run: |
          set -euo pipefail
          docker pull "$VALHALLA_IMAGE"
          docker image inspect --format='{{index .RepoDigests 0}}' "$VALHALLA_IMAGE" | tee probe/out/valhalla-image.txt
          grep -Fq "sha256:cf618ccafdead96829282acc81a70aa00947c2f28ddcf118f0194acf2fbc7e9d" probe/out/valhalla-image.txt

      - name: Build deterministic Valhalla tiles
        run: |
          set -euo pipefail
          mkdir -p probe/out/tiles
          docker run --rm \
            -v "$PWD/probe/out:/data" \
            "$VALHALLA_IMAGE" \
            bash -lc '
              set -euo pipefail
              valhalla_build_config \
                --mjolnir-tile-dir /data/tiles \
                --mjolnir-tile-extract /data/valhalla_tiles.tar \
                --mjolnir-timezone /data/tiles/timezones.sqlite \
                --mjolnir-admin /data/tiles/admins.sqlite \
                > /data/valhalla.json
              valhalla_build_tiles -c /data/valhalla.json /data/routing.osm.pbf
              valhalla_build_extract -c /data/valhalla.json -v
            '
          test -s probe/out/valhalla.json
          test -s probe/out/valhalla_tiles.tar
          sha256sum probe/out/valhalla_tiles.tar | tee probe/out/tiles.sha256

      - name: Build normalized Rust route contract runner
        run: cargo build --locked -p cargo-geo-probe --bin route-contract

      - name: Run real Valhalla T01-T10 contract
        run: bash probe/run_t01_t10.sh

      - name: Run matrix, isolation, failure and rebuild T11-T20 contract
        run: bash probe/run_t11_t20.sh

      - name: Write machine-readable full routing report
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          fixture = pathlib.Path("probe/fixture/routing.osm").read_bytes()
          digest = pathlib.Path("probe/out/valhalla-image.txt").read_text().strip()
          osmium = pathlib.Path("probe/out/osmium-version.txt").read_text().strip()
          report = {
              "probe_version": "routing-probe-v1",
              "phase": "full-routing-contract",
              "commit_sha": os.environ["GIT_SHA"],
              "valhalla_version": os.environ["VALHALLA_VERSION"],
              "valhalla_image": os.environ["VALHALLA_IMAGE"],
              "valhalla_image_digest": digest,
              "fixture_sha256": hashlib.sha256(fixture).hexdigest(),
              "conversion_tool": osmium,
              "test_cases": {f"T{i:02d}": "pass" for i in range(1, 21)},
              "t01_t10": json.loads(pathlib.Path("probe/out/t01-t10/report.json").read_text()),
              "t11_t20": json.loads(pathlib.Path("probe/out/t11-t20/report.json").read_text()),
              "pass": True,
          }
          pathlib.Path("probe/out/routing-probe-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat probe/out/routing-probe-report.json

      - name: Upload routing probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: routing-probe
          path: probe/out/
          if-no-files-found: error
        if: always()
