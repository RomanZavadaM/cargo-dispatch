name: Connectivity prototype

on:
  push:
    branches:
      - "prototype/connectivity-r1"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "web/**"
      - "prototype/**"
      - ".github/workflows/connectivity-prototype.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality + browser syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Browser harness syntax
        run: node --check web/app.js

  cross-platform:
    name: Cross-platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace --all-targets

  turn-relay-smoke:
    name: TURN relay-only smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install coturn
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
      - name: Start local coturn with time-limited secret auth
        run: |
          sudo systemctl stop coturn || true
          sudo pkill turnserver || true
          turnserver \
            --listening-ip=127.0.0.1 \
            --relay-ip=127.0.0.1 \
            --listening-port=3479 \
            --min-port=49160 \
            --max-port=49200 \
            --use-auth-secret \
            --static-auth-secret=cargo-smoke-secret \
            --realm=cargo.local \
            --allow-loopback-peers \
            --no-cli \
            --log-file=stdout \
            --fingerprint \
            > /tmp/coturn.log 2>&1 &
          echo $! > /tmp/coturn.pid
          sleep 2
      - name: TURN relay-only WebRTC data channel
        env:
          CARGO_TURN_SMOKE_URL: turn:127.0.0.1:3479?transport=udp
          CARGO_TURN_SMOKE_SECRET: cargo-smoke-secret
        run: cargo run -p cargo-turn-smoke
      - name: Show coturn log on failure
        if: failure()
        run: cat /tmp/coturn.log || true

  server-package:
    name: Server package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --env-file deploy/.env.example -f deploy/compose.example.yml config >/dev/null
      - name: Build gateway image
        run: docker build -f deploy/gateway.Dockerfile -t cargo-connectivity-gateway:test .
      - name: Run gateway image smoke
        run: |
          docker run -d --rm --name cargo-gateway-smoke -p 127.0.0.1:18080:8080 cargo-connectivity-gateway:test
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health | grep -q '^ok
  msrv:
    name: MSRV 1.91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - name: Check workspace on declared minimum Rust
        run: cargo check --workspace --all-targets
; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health | grep -q '^ok
  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - name: Check workspace on declared minimum Rust
        run: cargo check --workspace --all-targets

          curl --fail --silent http://127.0.0.1:18080/ | grep -q 'Тестове вікно водія'
          docker stop cargo-gateway-smoke

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - name: Check workspace on declared minimum Rust
        run: cargo check --workspace --all-targets
