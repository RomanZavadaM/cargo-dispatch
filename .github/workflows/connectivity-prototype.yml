name: Connectivity prototype

on:
  push:
    branches:
      - "prototype/connectivity-r1"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "web/**"
      - "prototype/**"
      - ".github/workflows/connectivity-prototype.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality + browser syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Browser harness syntax
        run: node --check web/app.js

  cross-platform:
    name: Cross-platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace --all-targets
