name: Generate Control Gateway lockfile

on:
  push:
    branches:
      - "product/control-gateway-r1"
    paths:
      - "Cargo.toml"
      - "crates/control-gateway-client/Cargo.toml"
      - ".github/workflows/control-gateway-lock.yml"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
      - name: Generate exact dependency lock
        run: cargo generate-lockfile
      - name: Upload generated lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: control-gateway-generated-lock
          path: Cargo.lock
          if-no-files-found: error
