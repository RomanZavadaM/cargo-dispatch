name: Generate Control Gateway lockfile

on:
  push:
    branches:
      - "product/control-gateway-r1"
    paths:
      - "Cargo.toml"
      - "crates/control-gateway-client/Cargo.toml"
      - ".github/workflows/control-gateway-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
      - name: Generate exact dependency lock
        run: cargo generate-lockfile
      - name: Commit generated lockfile to branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Lock Control gateway rustls dependencies"
          git push origin HEAD:product/control-gateway-r1
