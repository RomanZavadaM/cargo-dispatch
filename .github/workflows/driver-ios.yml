name: Driver iOS

on:
  push:
    branches:
      - "product/driver-ios-r*"
    paths:
      - "apps/driver-ios/**"
      - ".github/workflows/driver-ios.yml"
  pull_request:
    paths:
      - "apps/driver-ios/**"
      - ".github/workflows/driver-ios.yml"

permissions:
  contents: read

concurrency:
  group: driver-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: iOS core tests + Simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core protocol tests
        run: swift test --package-path apps/driver-ios

      - name: Build iPhone/iPad Simulator app
        run: |
          xcodebuild \
            -project apps/driver-ios/CargoDispatchDriver.xcodeproj \
            -scheme CargoDispatchDriver \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/driver-ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch app in clean iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          APP="apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app"
          read -r RUNTIME DEVICE_TYPE <<EOF
          $(python3 - <<'PY'
          import json, subprocess

          runtimes = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"])
          ).get("runtimes", [])
          ios = [
              runtime for runtime in runtimes
              if runtime.get("isAvailable") and runtime.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
          ]
          if not ios:
              raise SystemExit("No available iOS Simulator runtime")
          runtime = max(ios, key=lambda item: tuple(int(part) for part in item["version"].split(".")))

          device_types = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"])
          ).get("devicetypes", [])
          import re
          iphones = []
          for item in device_types:
              match = re.match(r"^iPhone\s+(\d+)", item.get("name", ""))
              if match:
                  iphones.append((int(match.group(1)), item.get("name", ""), item["identifier"]))
          if not iphones:
              raise SystemExit("No numbered iPhone Simulator device type")
          _, _, device_type = max(iphones)
          print(runtime["identifier"], device_type)
          PY
          )
          EOF

          xcrun simctl shutdown all || true

          python3 - "$RUNTIME" "$DEVICE_TYPE" "$APP" <<'PY'
          import subprocess, sys, time

          runtime, device_type, app = sys.argv[1:]
          last_error = None
          for attempt in range(2):
              name = f"CargoDispatchDriverCI-{attempt + 1}"
              udid = subprocess.check_output(
                  ["xcrun", "simctl", "create", name, device_type, runtime],
                  text=True,
              ).strip()
              try:
                  subprocess.run(["xcrun", "simctl", "boot", udid], check=False)
                  subprocess.run(
                      ["xcrun", "simctl", "bootstatus", udid, "-b"],
                      check=True,
                      timeout=180,
                  )
                  subprocess.run(["xcrun", "simctl", "install", udid, app], check=True)
                  subprocess.run(
                      ["xcrun", "simctl", "launch", udid, "com.romanzavada.cargodispatch.driver"],
                      check=True,
                  )
                  time.sleep(3)
                  subprocess.run(
                      [
                          "xcrun", "simctl", "io", udid, "screenshot",
                          "apps/driver-ios/driver-ios-smoke.png",
                      ],
                      check=True,
                  )
                  subprocess.run(
                      [
                          "xcrun", "simctl", "terminate", udid,
                          "com.romanzavada.cargodispatch.driver",
                      ],
                      check=False,
                  )
                  subprocess.run(["xcrun", "simctl", "delete", udid], check=False)
                  raise SystemExit(0)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  last_error = error
                  subprocess.run(["xcrun", "simctl", "shutdown", udid], check=False)
                  subprocess.run(["xcrun", "simctl", "delete", udid], check=False)

          raise SystemExit(f"Fresh iPhone Simulator smoke failed twice: {last_error}")
          PY

      - name: Upload Simulator smoke screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-iOS-Simulator-smoke
          path: apps/driver-ios/driver-ios-smoke.png
          if-no-files-found: error

      - name: Upload Simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-iOS-Simulator
          path: apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app
          if-no-files-found: error
