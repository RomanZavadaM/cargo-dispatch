name: Driver iOS

on:
  push:
    branches:
      - "product/driver-ios-r*"
    paths:
      - "apps/driver-ios/**"
      - "crates/control-web/**"
      - "crates/trip-files/**"
      - ".github/workflows/driver-ios.yml"
  pull_request:
    paths:
      - "apps/driver-ios/**"
      - "crates/control-web/**"
      - "crates/trip-files/**"
      - ".github/workflows/driver-ios.yml"

permissions:
  contents: read

concurrency:
  group: driver-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: iOS core tests + Simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core protocol tests
        run: swift test --package-path apps/driver-ios

      - name: Build iPhone/iPad Simulator app
        run: |
          xcodebuild \
            -project apps/driver-ios/CargoDispatchDriver.xcodeproj \
            -scheme CargoDispatchDriver \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/driver-ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Prepare real Control smoke session
        run: |
          cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- native-smoke-data
          cargo build --locked -p cargo-dispatch-control-web --example native_smoke_server

      - name: Launch connected app in iPhone Simulator
        shell: bash
        run: |
          DEVICE="$(
            python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime_devices in data.get("devices", {}).values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator device")
          PY
          )"
          target/debug/examples/native_smoke_server             native-smoke-data/synthetic-trip-package.zip             native-smoke-session-00000001             > apps/driver-ios/native-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 80); do
            if grep -q '^CARGO_DISPATCH_SMOKE_LOCAL_URL=' apps/driver-ios/native-smoke.log; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat apps/driver-ios/native-smoke.log
              exit 1
            fi
            sleep 0.25
          done
          cat apps/driver-ios/native-smoke.log
          IOS_DRIVER_URL="$(sed -n 's/^CARGO_DISPATCH_SMOKE_LOCAL_URL=//p' apps/driver-ios/native-smoke.log | tail -n 1)"
          test -n "$IOS_DRIVER_URL"

          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.romanzavada.cargodispatch.driver             -cargo_dispatch_driver_url "$IOS_DRIVER_URL"
          sleep 5
          xcrun simctl io "$DEVICE" screenshot apps/driver-ios/driver-ios-smoke.png
          xcrun simctl terminate "$DEVICE" com.romanzavada.cargodispatch.driver || true

          DATA_CONTAINER="$(xcrun simctl get_app_container "$DEVICE" com.romanzavada.cargodispatch.driver data)"
          PREFS="$DATA_CONTAINER/Library/Preferences/com.romanzavada.cargodispatch.driver.plist"
          CONNECTED=0
          for _ in $(seq 1 20); do
            if [ -f "$PREFS" ]               && plutil -p "$PREFS" | grep -q 'native-smoke-session-00000001'; then
              CONNECTED=1
              break
            fi
            sleep 0.5
          done
          if [ "$CONNECTED" -ne 1 ]; then
            if [ -f "$PREFS" ]; then
              plutil -p "$PREFS" || true
            fi
            exit 1
          fi

      - name: Upload Simulator smoke screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-iOS-Simulator-smoke
          path: apps/driver-ios/driver-ios-smoke.png
          if-no-files-found: error

      - name: Upload Simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-iOS-Simulator
          path: apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app
          if-no-files-found: error
