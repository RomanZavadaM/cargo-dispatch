name: Driver iOS

on:
  push:
    branches:
      - "product/driver-ios-r*"
    paths:
      - "apps/driver-ios/**"
      - "crates/control-web/**"
      - "crates/trip-files/**"
      - ".github/workflows/driver-ios.yml"
  pull_request:
    paths:
      - "apps/driver-ios/**"
      - "crates/control-web/**"
      - "crates/trip-files/**"
      - ".github/workflows/driver-ios.yml"

permissions:
  contents: read

concurrency:
  group: driver-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: iOS core tests + Simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core protocol tests
        run: swift test --package-path apps/driver-ios

      - name: Build iPhone/iPad Simulator app
        run: |
          xcodebuild \
            -project apps/driver-ios/CargoDispatchDriver.xcodeproj \
            -scheme CargoDispatchDriver \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/driver-ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify background location mode in built app
        shell: bash
        run: |
          INFO="apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app/Info.plist"
          test -f "$INFO"
          plutil -p "$INFO"
          python3 - "$INFO" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as handle:
              info = plistlib.load(handle)
          modes = info.get("UIBackgroundModes")
          if not isinstance(modes, list) or "location" not in modes:
              raise SystemExit(f"UIBackgroundModes must be an array containing location, got: {modes!r}")
          PY

      - name: Prepare real Control smoke session
        run: |
          cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- native-smoke-data
          cargo build --locked -p cargo-dispatch-control-web --example native_smoke_server

      - name: Launch connected app in clean iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail

          read -r RUNTIME DEVICE_TYPE <<EOF
          $(python3 - <<'PY'
          import json, re, subprocess

          data = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          )

          def runtime_version(identifier):
              marker = ".iOS-"
              if marker not in identifier:
                  return ()
              suffix = identifier.split(marker, 1)[1]
              return tuple(int(part) for part in suffix.split("-") if part.isdigit())

          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              version = runtime_version(runtime)
              if not version:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device.get("name", "")
                  device_type = device.get("deviceTypeIdentifier")
                  if not name.startswith("iPhone") or not device_type:
                      continue
                  model = re.search(r"iPhone\s+(\d+)", name)
                  model_number = int(model.group(1)) if model else 0
                  candidates.append((version, model_number, runtime, device_type))

          if not candidates:
              raise SystemExit("No compatible available iPhone Simulator definition")
          _, _, runtime, device_type = max(candidates)
          print(runtime, device_type)
          PY
          )
          EOF

          DEVICE="$(xcrun simctl create CargoDispatchDriverCI "$DEVICE_TYPE" "$RUNTIME")"
          cleanup() {
            kill "${PROXY_PID:-}" 2>/dev/null || true
            kill "${SERVER_PID:-}" 2>/dev/null || true
            xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
            xcrun simctl delete "$DEVICE" 2>/dev/null || true
          }
          trap cleanup EXIT

          target/debug/examples/native_smoke_server             native-smoke-data/synthetic-trip-package.zip             native-smoke-session-00000001             > apps/driver-ios/native-smoke.log 2>&1 &
          SERVER_PID=$!

          for _ in $(seq 1 80); do
            if grep -q '^CARGO_DISPATCH_SMOKE_LOCAL_URL=' apps/driver-ios/native-smoke.log; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat apps/driver-ios/native-smoke.log
              exit 1
            fi
            sleep 0.25
          done
          cat apps/driver-ios/native-smoke.log
          CONTROL_DRIVER_URL="$(sed -n 's/^CARGO_DISPATCH_SMOKE_LOCAL_URL=//p' apps/driver-ios/native-smoke.log | tail -n 1)"
          test -n "$CONTROL_DRIVER_URL"

          : > apps/driver-ios/native-proxy-requests.log
          python3 .github/scripts/native-ios-smoke-proxy.py \
            "$CONTROL_DRIVER_URL" \
            apps/driver-ios/native-proxy-requests.log \
            > apps/driver-ios/native-proxy.log 2>&1 &
          PROXY_PID=$!

          for _ in $(seq 1 80); do
            if grep -q '^CARGO_DISPATCH_SMOKE_PROXY_URL=' apps/driver-ios/native-proxy.log; then
              break
            fi
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              cat apps/driver-ios/native-proxy.log
              exit 1
            fi
            sleep 0.25
          done
          cat apps/driver-ios/native-proxy.log
          IOS_DRIVER_URL="$(sed -n 's/^CARGO_DISPATCH_SMOKE_PROXY_URL=//p' apps/driver-ios/native-proxy.log | tail -n 1)"
          test -n "$IOS_DRIVER_URL"

          xcrun simctl boot "$DEVICE"
          python3 - "$DEVICE" <<'PY'
          import subprocess, sys
          subprocess.run(
              ["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"],
              check=True,
              timeout=480,
          )
          PY

          APP="apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app"
          BUNDLE="com.romanzavada.cargodispatch.driver"
          xcrun simctl install "$DEVICE" "$APP"

          # Seed the r1-r5 legacy raw URL through Simulator's real
          # UserDefaults/cfprefsd path. Writing the plist file directly bypasses
          # cfprefsd and can leave the smoke test reading stale preference data.
          DATA_CONTAINER="$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)"
          PREFS="$DATA_CONTAINER/Library/Preferences/$BUNDLE.plist"
          xcrun simctl spawn "$DEVICE" defaults write "$BUNDLE" cargo_dispatch_driver_url -string "$IOS_DRIVER_URL"
          xcrun simctl spawn "$DEVICE" defaults read "$BUNDLE"

          xcrun simctl launch "$DEVICE" "$BUNDLE"

          FIRST_CONNECTED=0
          for _ in $(seq 1 160); do
            REQUEST_COUNT="$(grep -c '^GET /api/trip/native-smoke-session-00000001 ' apps/driver-ios/native-proxy-requests.log || true)"
            # DriverStore completes its initial connection with two trip reads:
            # one verifies the session, the second refreshes after pending-queue
            # flushing. SecureSessionStore.save() runs immediately after that.
            if [ "$REQUEST_COUNT" -ge 2 ]; then
              FIRST_CONNECTED=1
              break
            fi
            sleep 0.5
          done
          if [ "$FIRST_CONNECTED" -ne 1 ]; then
            echo "Apple Driver did not complete the initial Control connection during legacy-session migration." >&2
            cat apps/driver-ios/native-proxy.log || true
            cat apps/driver-ios/native-proxy-requests.log || true
            exit 1
          fi

          # Let the post-refresh secure save finish, then stop the first process
          # so UserDefaults is flushed to its real on-disk state.
          sleep 1
          xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          sleep 1

          if [ ! -f "$PREFS" ]; then
            echo "Apple Driver preferences were not persisted after first connection." >&2
            exit 1
          fi

          BASE_URL="$(xcrun simctl spawn "$DEVICE" defaults read "$BUNDLE" cargo_dispatch_driver_base_url 2>/dev/null || true)"
          if [ -z "$BASE_URL" ]; then
            echo "non-secret Driver base URL was not persisted" >&2
            xcrun simctl spawn "$DEVICE" defaults read "$BUNDLE" || true
            exit 1
          fi
          if xcrun simctl spawn "$DEVICE" defaults read "$BUNDLE" cargo_dispatch_driver_url >/dev/null 2>&1; then
            echo "legacy raw Driver URL remained in UserDefaults" >&2
            xcrun simctl spawn "$DEVICE" defaults read "$BUNDLE" >&2 || true
            exit 1
          fi
          if xcrun simctl spawn "$DEVICE" defaults read "$BUNDLE" | grep -q 'native-smoke-session-00000001'; then
            echo "Raw Apple Driver session token remained in UserDefaults after migration." >&2
            xcrun simctl spawn "$DEVICE" defaults read "$BUNDLE" >&2 || true
            exit 1
          fi

          REQUESTS_BEFORE_RELAUNCH="$(grep -c '^GET /api/trip/native-smoke-session-00000001 ' apps/driver-ios/native-proxy-requests.log || true)"

          # Relaunch with no Driver URL. Any new trip request proves the app
          # reconstructed the session from UserDefaults base URL + Keychain token.
          xcrun simctl launch "$DEVICE" "$BUNDLE"

          RECONNECTED=0
          for _ in $(seq 1 120); do
            REQUEST_COUNT="$(grep -c '^GET /api/trip/native-smoke-session-00000001 ' apps/driver-ios/native-proxy-requests.log || true)"
            if [ "$REQUEST_COUNT" -gt "$REQUESTS_BEFORE_RELAUNCH" ]; then
              RECONNECTED=1
              break
            fi
            sleep 0.5
          done
          if [ "$RECONNECTED" -ne 1 ]; then
            echo "Apple Driver did not reconnect from Keychain after relaunch." >&2
            plutil -p "$PREFS" || true
            cat apps/driver-ios/native-proxy-requests.log || true
            exit 1
          fi

          xcrun simctl io "$DEVICE" screenshot apps/driver-ios/driver-ios-smoke.png
          xcrun simctl terminate "$DEVICE" "$BUNDLE" || true

      - name: Upload Simulator smoke screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-iOS-Simulator-smoke
          path: apps/driver-ios/driver-ios-smoke.png
          if-no-files-found: error

      - name: Upload Simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Driver-iOS-Simulator
          path: apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app
          if-no-files-found: error
