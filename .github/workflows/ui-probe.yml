name: UI prototype

on:
  push:
    branches:
      - "prototype/ui-r1"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ui-probe-core/**"
      - "apps/leptos-web/**"
      - "apps/driver-web/**"
      - "apps/tauri-shell/**"
      - "probe/ui/**"
      - "deny.toml"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/ui-probe.yml"

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: "0.22.2"

jobs:
  core:
    name: Shared application boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          components: rustfmt, clippy

      - name: Verify committed dependency lock
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Format
        run: cargo fmt --all -- --check

      - name: Core check
        run: cargo check --locked -p ui-probe-core --all-targets

      - name: Core clippy
        run: cargo clippy --locked -p ui-probe-core --all-targets -- -D warnings

      - name: Core tests
        run: cargo test --locked -p ui-probe-core --all-targets

      - name: Install dependency checker
        run: cargo install cargo-deny --locked --version 0.21.0

      - name: Check dependency licenses and advisories
        run: cargo deny check licenses advisories bans sources

  browser:
    name: Leptos CSR browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.2

      - name: Build browser harness
        working-directory: apps/leptos-web
        run: trunk build --release=true

      - name: Build standalone driver browser
        working-directory: apps/driver-web
        run: trunk build --release=true

      - name: Install browser contract runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.65.1
          npx playwright install --with-deps chromium

      - name: Run browser pool, editor, route, map and desktop-boundary contracts
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/leptos-web/dist > /tmp/ui-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; cat /tmp/ui-http.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          npx playwright test probe/ui/browser/p01.spec.mjs probe/ui/browser/p02.spec.mjs probe/ui/browser/p03.spec.mjs probe/ui/browser/p04.spec.mjs probe/ui/browser/p05.spec.mjs probe/ui/browser/p09-planner.spec.mjs probe/ui/browser/p10-planner.spec.mjs --reporter=line --workers=1

      - name: Run standalone driver browser contract
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory apps/driver-web/dist > /tmp/driver-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; cat /tmp/driver-http.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then
              break
            fi
            sleep 1
          done
          npx playwright test probe/ui/browser/p07.spec.mjs probe/ui/browser/p08.spec.mjs probe/ui/browser/p09-driver.spec.mjs probe/ui/browser/p10-driver.spec.mjs --reporter=line --workers=1

      - name: Record browser artifact
        run: |
          set -euo pipefail
          mkdir -p probe/ui/out
          du -sb apps/leptos-web/dist | awk '{print $1}' > probe/ui/out/leptos-dist-bytes.txt
          du -sb apps/driver-web/dist | awk '{print $1}' > probe/ui/out/driver-dist-bytes.txt
          printf '%s\n' "leptos=0.8.23" "trunk=$TRUNK_VERSION" "playwright=1.65.1" > probe/ui/out/browser-versions.txt
          test -s probe/ui/out/p01-browser.json
          test -s probe/ui/out/p02-browser.json
          test -s probe/ui/out/p03-browser.json
          test -s probe/ui/out/p04-browser.json
          test -s probe/ui/out/p05-browser.json
          test -s probe/ui/out/p07-driver-browser.json
          test -s probe/ui/out/p08-documents.json
          test -s probe/ui/out/p09-i18n-planner.json
          test -s probe/ui/out/p09-i18n-driver.json
          test -s probe/ui/out/p10-accessibility-planner.json
          test -s probe/ui/out/p10-accessibility-driver.json

      - uses: actions/upload-artifact@v4
        with:
          name: ui-browser-command-boundary
          path: |
            apps/leptos-web/dist/
            apps/driver-web/dist/
            probe/ui/out/
          if-no-files-found: error

  desktop:
    name: Tauri check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Check Tauri shell
        run: cargo check --locked -p ui-probe-tauri

      - name: Test desktop document boundary
        run: cargo test --locked -p ui-probe-tauri local_document_round_trip_reads_pdf_and_writes_image

      - name: Test full desktop command boundary
        if: runner.os == 'Linux'
        run: cargo test --locked -p ui-probe-tauri --all-targets

  report:
    name: Accessibility and keyboard report
    if: always()
    needs:
      - core
      - browser
      - desktop
    runs-on: ubuntu-latest
    steps:
      - name: Write machine-readable foundation result
        env:
          CORE: ${{ needs.core.result }}
          BROWSER: ${{ needs.browser.result }}
          DESKTOP: ${{ needs.desktop.result }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          report = {
              "probe": "ui-r1",
              "phase": "accessibility-keyboard",
              "commit_sha": os.environ["GIT_SHA"],
              "versions": {
                  "rust_msrv": "1.91",
                  "leptos": "0.8.23",
                  "trunk": "0.22.2",
                  "tauri": "2.12.7",
                  "playwright": "1.65.1",
              },
              "checks": {
                  "shared_application_boundary": os.environ["CORE"],
                  "p01_5k_browser_contract": os.environ["BROWSER"],
                  "p02_editor_contract": os.environ["BROWSER"],
                  "working_route_contract": os.environ["BROWSER"],
                  "map_bridge_contract": os.environ["BROWSER"],
                  "standalone_browser_boundary": os.environ["BROWSER"],
                  "desktop_command_boundary": os.environ["DESKTOP"],
                  "multi_window_control": os.environ["DESKTOP"],
                  "driver_browser_contract": os.environ["BROWSER"],
                  "browser_document_upload_download": os.environ["BROWSER"],
                  "desktop_document_open_save": os.environ["DESKTOP"],
                  "i18n_runtime_switch": os.environ["BROWSER"],
                  "shared_language_codes": os.environ["CORE"],
                  "keyboard_focus_contract": os.environ["BROWSER"],
                  "driver_touch_accessibility": os.environ["BROWSER"],
                  "tauri_cross_platform_check": os.environ["DESKTOP"],
              },
          }
          report["pass"] = all(value == "success" for value in report["checks"].values())
          with open("ui-accessibility-report.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report["pass"]:
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-accessibility-report
          path: ui-accessibility-report.json
          if-no-files-found: error
