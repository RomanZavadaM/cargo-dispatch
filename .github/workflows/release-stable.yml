name: Publish stable product

# Publication happens only on main: a push that changes .release-stable, or a manual
# run on main, and only when .release-stable equals the workspace version and the tag
# does not exist yet. A pull request that touches the release machinery builds every
# package and keeps the result as a workflow artifact without publishing anything.

on:
  push:
    branches:
      - main
    paths:
      - ".release-stable"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-stable.yml"
      - ".github/scripts/collect-third-party-licenses.py"
      - "deploy/addressing-gateway/**"

permissions:
  contents: read

concurrency:
  group: publish-stable-product-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Decide the tag and whether to publish
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected workspace version: '$VERSION'"
            exit 1
          fi
          grep -q "\"version\": \"$VERSION\"" apps/control-desktop/src-tauri/tauri.conf.json
          grep -q "\"version\": \"$VERSION\"" apps/planner-desktop/src-tauri/tauri.conf.json
          grep -q "versionName = \"$VERSION\"" apps/driver-android/app/build.gradle.kts
          grep -q "MARKETING_VERSION = $VERSION;" apps/driver-ios/CargoDispatchDriver.xcodeproj/project.pbxproj
          TAG="v$VERSION"
          PUBLISH=false
          MARKER="$(tr -d '\r\n' < .release-stable)"
          if [[ "$EVENT" != "pull_request" && "$REF" == "refs/heads/main" ]]; then
            if [[ "$MARKER" == "$TAG" ]]; then
              if [[ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]]; then
                echo "Tag $TAG already exists; a published release is never rewritten."
                exit 1
              fi
              PUBLISH=true
            elif [[ "$EVENT" == "push" ]]; then
              echo ".release-stable is '$MARKER' but the workspace version is '$TAG'."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Release plan: $TAG, publish=$PUBLISH"

  gate:
    name: Full checks at the release commit
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          components: rustfmt, clippy

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude cargo-dispatch-control-ui --exclude cargo-dispatch-control-desktop --exclude cargo-dispatch-planner-ui --exclude cargo-dispatch-planner-desktop --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --exclude cargo-dispatch-control-ui --exclude cargo-dispatch-control-desktop --exclude cargo-dispatch-planner-ui --exclude cargo-dispatch-planner-desktop --all-targets

      - name: Verify all project locales
        run: python3 .github/scripts/check-localizations.py

      - name: Install dependency checker
        run: cargo install cargo-deny --locked --version 0.21.0

      - name: Dependency licenses and advisories
        run: cargo deny check licenses advisories bans sources

      - name: Collect third-party license texts
        run: |
          python3 .github/scripts/test_collect_third_party_licenses.py
          mkdir -p licenses
          python3 .github/scripts/collect-third-party-licenses.py licenses/THIRD_PARTY_LICENSES.txt

      - name: Upload license texts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Stable-Licenses
          path: licenses/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  android-stable:
    name: Build Android stable
    needs: [prepare, gate]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Test and build Android Driver
        working-directory: apps/driver-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Stage Android release asset
        shell: bash
        run: |
          test -n "$TAG"
          cp apps/driver-android/app/build/outputs/apk/debug/app-debug.apk             "Cargo-Dispatch-Driver-$TAG-Android-debug.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Stable-Android
          path: Cargo-Dispatch-Driver-*-Android-debug.apk
          if-no-files-found: error

  apple-stable:
    name: Build Apple Simulator stable
    needs: [prepare, gate]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Core protocol tests
        run: swift test --package-path apps/driver-ios

      - name: Build iPhone/iPad Simulator app
        run: |
          xcodebuild             -project apps/driver-ios/CargoDispatchDriver.xcodeproj             -scheme CargoDispatchDriver             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath apps/driver-ios/build/DerivedData             CODE_SIGNING_ALLOWED=YES             CODE_SIGN_IDENTITY=-             build

      - name: Verify Apple Simulator signature
        shell: bash
        run: |
          APP="apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app"
          test -d "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1
          codesign --verify --deep --strict "$APP"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Licenses
          path: licenses

      - name: Stage Apple Simulator release asset
        shell: bash
        run: |
          APP="apps/driver-ios/build/DerivedData/Build/Products/Debug-iphonesimulator/CargoDispatchDriver.app"
          PACKAGE="Cargo-Dispatch-Driver-$TAG-iOS-Simulator"
          test -d "$APP"
          mkdir -p "$PACKAGE"
          ditto "$APP" "$PACKAGE/CargoDispatchDriver.app"
          cp LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md licenses/THIRD_PARTY_LICENSES.txt "$PACKAGE/"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE" "$PACKAGE.zip"
          unzip -Z1 "$PACKAGE.zip" | grep -q "^$PACKAGE/"

      - name: Upload Apple Simulator release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Stable-Apple
          path: Cargo-Dispatch-Driver-*-iOS-Simulator.zip
          if-no-files-found: error

  macos-stable:
    name: Build macOS Control stable
    needs: [prepare, gate]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Add both macOS Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Control frontend
        working-directory: apps/control-ui
        run: trunk build --release=true

      - name: Build universal macOS Control executable
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p cargo-dispatch-control-desktop --release --target x86_64-apple-darwin
          cargo build --locked -p cargo-dispatch-control-desktop --release --target aarch64-apple-darwin
          lipo -create             target/x86_64-apple-darwin/release/cargo-dispatch-control-desktop             target/aarch64-apple-darwin/release/cargo-dispatch-control-desktop             -output Cargo-Dispatch-Control
          chmod +x Cargo-Dispatch-Control
          lipo -info Cargo-Dispatch-Control

      - name: Create synthetic acceptance data
        run: cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- local-browser-test-data

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Licenses
          path: licenses

      - name: Stage macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="Cargo-Dispatch-Control-$TAG-macOS-universal"
          APP="$PACKAGE/Cargo Dispatch Control.app"
          mkdir -p "$APP/Contents/MacOS"
          cp Cargo-Dispatch-Control "$APP/Contents/MacOS/Cargo-Dispatch-Control"
          cp LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md licenses/THIRD_PARTY_LICENSES.txt "$PACKAGE/"
          cp -R local-browser-test-data "$PACKAGE/local-browser-test-data"

          python3 - "$APP/Contents/Info.plist" "$TAG" <<'PY'
          import plistlib, sys
          path, tag = sys.argv[1:]
          info = {
              "CFBundleDevelopmentRegion": "uk",
              "CFBundleDisplayName": "Cargo Dispatch Control",
              "CFBundleExecutable": "Cargo-Dispatch-Control",
              "CFBundleIdentifier": "ua.cargodispatch.control",
              "CFBundleInfoDictionaryVersion": "6.0",
              "CFBundleName": "Cargo Dispatch Control",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": tag.removeprefix("v"),
              "CFBundleVersion": "1",
              "LSMinimumSystemVersion": "12.0",
              "NSHighResolutionCapable": True,
          }
          with open(path, "wb") as handle:
              plistlib.dump(info, handle)
          PY

          cat > "$PACKAGE/README.txt" <<EOF
          Cargo Dispatch Control $TAG — macOS (Intel та Apple Silicon)

          Відкрийте Cargo Dispatch Control.app. Програма не підписана: якщо macOS не дає
          її відкрити, скористайтеся Finder -> права кнопка -> «Відкрити».

          Перевірка з тестовими (вигаданими) даними:
          1. «Додати рейс» -> «Відкрити існуючий рейс» -> тека local-browser-test-data/active-trip -> «Підключити рейс».
          2. «Підключити водіїв» -> «Цей комп'ютер» або «Та сама мережа Wi-Fi».
          3. Відкрийте посилання для водія з блока «Що робити далі».
          Для телефона в мережі дозвольте програму в брандмауері комп'ютера.

          Ліцензія: LICENSE.md. Сторонні компоненти: THIRD_PARTY_NOTICES.md і THIRD_PARTY_LICENSES.txt.
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE" "$PACKAGE.zip"

      - name: Upload macOS Control release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Stable-macOS
          path: Cargo-Dispatch-Control-*-macOS-universal.zip
          if-no-files-found: error

  linux-control-stable:
    name: Build Linux Control stable
    needs: [prepare, gate]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Install Linux Tauri dependencies
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Control frontend
        working-directory: apps/control-ui
        run: trunk build --release=true

      - name: Test Control desktop service
        run: cargo test --locked -p cargo-dispatch-control-desktop --all-targets

      - name: Build Linux Control executable
        run: cargo build --locked -p cargo-dispatch-control-desktop --release

      - name: Create synthetic acceptance data
        run: cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- local-browser-test-data

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Licenses
          path: licenses

      - name: Stage Linux Control package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="Cargo-Dispatch-Control-$TAG-Linux-x64"
          mkdir -p "$PACKAGE"
          cp target/release/cargo-dispatch-control-desktop "$PACKAGE/Cargo-Dispatch-Control"
          chmod +x "$PACKAGE/Cargo-Dispatch-Control"
          cp LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md licenses/THIRD_PARTY_LICENSES.txt "$PACKAGE/"
          cp -R local-browser-test-data "$PACKAGE/local-browser-test-data"
          cat > "$PACKAGE/README.txt" <<EOF
          Cargo Dispatch Control $TAG — Linux x64

          Запустіть ./Cargo-Dispatch-Control у графічному сеансі (потрібен WebKitGTK 4.1).

          Перевірка з тестовими (вигаданими) даними:
          1. «Додати рейс» -> «Відкрити існуючий рейс» -> тека local-browser-test-data/active-trip -> «Підключити рейс».
          2. «Підключити водіїв» -> «Цей комп'ютер» або «Та сама мережа Wi-Fi».
          3. Відкрийте посилання для водія з блока «Що робити далі».
          Для телефона в мережі дозвольте програму в брандмауері комп'ютера.

          Ліцензія: LICENSE.md. Сторонні компоненти: THIRD_PARTY_NOTICES.md і THIRD_PARTY_LICENSES.txt.
          EOF
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - name: Upload Linux Control release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Stable-Control-Linux
          path: Cargo-Dispatch-Control-*-Linux-x64.tar.gz
          if-no-files-found: error


  macos-planner-stable:
    name: Build macOS Planner stable
    needs: [prepare, gate]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Add both macOS Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Planner frontend
        working-directory: apps/planner-ui
        run: trunk build --release=true

      - name: Test Planner service
        run: cargo test --locked -p cargo-dispatch-planner-desktop --all-targets

      - name: Build universal macOS Planner executable
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p cargo-dispatch-planner-desktop --release --target x86_64-apple-darwin
          cargo build --locked -p cargo-dispatch-planner-desktop --release --target aarch64-apple-darwin
          lipo -create             target/x86_64-apple-darwin/release/cargo-dispatch-planner-desktop             target/aarch64-apple-darwin/release/cargo-dispatch-planner-desktop             -output Cargo-Dispatch-Planner
          chmod +x Cargo-Dispatch-Planner
          lipo -info Cargo-Dispatch-Planner

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Licenses
          path: licenses

      - name: Stage macOS Planner app bundle
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="Cargo-Dispatch-Planner-$TAG-macOS-universal"
          APP="$PACKAGE/Cargo Dispatch Planner.app"
          mkdir -p "$APP/Contents/MacOS"
          cp Cargo-Dispatch-Planner "$APP/Contents/MacOS/Cargo-Dispatch-Planner"
          cp LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md licenses/THIRD_PARTY_LICENSES.txt "$PACKAGE/"

          python3 - "$APP/Contents/Info.plist" "$TAG" <<'PY'
          import plistlib, sys
          path, tag = sys.argv[1:]
          info = {
              "CFBundleDevelopmentRegion": "uk",
              "CFBundleDisplayName": "Cargo Dispatch Planner",
              "CFBundleExecutable": "Cargo-Dispatch-Planner",
              "CFBundleIdentifier": "ua.cargodispatch.planner",
              "CFBundleInfoDictionaryVersion": "6.0",
              "CFBundleName": "Cargo Dispatch Planner",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": tag.removeprefix("v"),
              "CFBundleVersion": "1",
              "LSMinimumSystemVersion": "12.0",
              "NSHighResolutionCapable": True,
          }
          with open(path, "wb") as handle:
              plistlib.dump(info, handle)
          PY

          cat > "$PACKAGE/README.txt" <<EOF
          Cargo Dispatch Planner $TAG — macOS (Intel та Apple Silicon)

          Відкрийте Cargo Dispatch Planner.app. Програма не підписана: якщо macOS не дає
          її відкрити, скористайтеся Finder -> права кнопка -> «Відкрити».

          Заявки з файла (JSON) або вручну, варіанти маршрутів, чернетка маршруту,
          попередній маршрут через ваш сервер Valhalla, експорт пакета рейсу (ZIP)
          для Control. Вісім мов інтерфейсу.

          Ліцензія: LICENSE.md. Сторонні компоненти: THIRD_PARTY_NOTICES.md і THIRD_PARTY_LICENSES.txt.
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE" "$PACKAGE.zip"

      - name: Upload macOS Planner release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Stable-Planner-macOS
          path: Cargo-Dispatch-Planner-*-macOS-universal.zip
          if-no-files-found: error

