  gateway-stable:
    name: Build Linux Addressing Gateway stable
    needs: [prepare, gate]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Test and build gateway
        run: |
          cargo test --locked -p cargo-dispatch-addressing-gateway --all-targets
          cargo build --locked -p cargo-dispatch-addressing-gateway --release

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Licenses
          path: licenses

      - name: Stage gateway release package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="Cargo-Dispatch-Gateway-$TAG-Linux-x64"
          mkdir -p "$PACKAGE"
          cp target/release/cargo-dispatch-addressing-gateway "$PACKAGE/"
          cp deploy/addressing-gateway/Dockerfile.release "$PACKAGE/Dockerfile"
          cp deploy/addressing-gateway/docker-compose.release.yml "$PACKAGE/docker-compose.yml"
          cp deploy/addressing-gateway/README.release.md "$PACKAGE/README.md"
          cp LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md licenses/THIRD_PARTY_LICENSES.txt "$PACKAGE/"
          cp crates/addressing-gateway/README.md "$PACKAGE/PROTOCOL.md"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - name: Start the gateway from the release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf "Cargo-Dispatch-Gateway-$TAG-Linux-x64.tar.gz" -C smoke
          cd "smoke/Cargo-Dispatch-Gateway-$TAG-Linux-x64"
          export CARGO_DISPATCH_GATEWAY_CONTROL_TOKEN="ci-smoke-token-not-a-real-secret-000000"
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Upload gateway release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Stable-Gateway
          path: Cargo-Dispatch-Gateway-*-Linux-x64.tar.gz
          if-no-files-found: error

  windows-stable:
    name: Build and publish stable product
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    needs:
      - prepare
      - gate
      - android-stable
      - apple-stable
      - macos-stable
      - linux-control-stable
      - macos-planner-stable
      - linux-planner-stable
      - gateway-stable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Android
          path: mobile-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Apple
          path: mobile-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-macOS
          path: desktop-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Control-Linux
          path: desktop-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Planner-macOS
          path: planner-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Planner-Linux
          path: planner-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Gateway
          path: server-assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Cargo-Dispatch-Stable-Licenses
          path: licenses

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Install pinned Trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk@0.22.2
          fallback: none

      - name: Build Control frontend
        working-directory: apps/control-ui
        run: trunk build --release=true

      - name: Build Control Windows executable
        run: cargo build --locked -p cargo-dispatch-control-desktop --release

      - name: Test Control desktop service
        run: cargo test --locked -p cargo-dispatch-control-desktop --all-targets

      - name: Build Planner frontend
        working-directory: apps/planner-ui
        run: trunk build --release=true

      - name: Test Planner service
        run: cargo test --locked -p cargo-dispatch-planner-desktop --all-targets

      - name: Build Planner Windows executable
        run: cargo build --locked -p cargo-dispatch-planner-desktop --release

      - name: Create synthetic acceptance data
        run: cargo run --locked -p cargo-dispatch-trip-files --example local_browser_fixture -- local-browser-test-data

      - name: Stage stable package and checksums
        shell: pwsh
        run: |
          $packageName = "Cargo-Dispatch-Control-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Force $packageName | Out-Null
          Copy-Item "target/release/cargo-dispatch-control-desktop.exe" "$packageName/Cargo-Dispatch-Control.exe"
          Copy-Item "LICENSE.md", "COPYRIGHT.md", "THIRD_PARTY_NOTICES.md", "licenses/THIRD_PARTY_LICENSES.txt" -Destination "$packageName"
          Copy-Item "local-browser-test-data" "$packageName/local-browser-test-data" -Recurse
          @"
          Cargo Dispatch Control $env:TAG — Windows x64

          Запустіть Cargo-Dispatch-Control.exe. Програма не підписана.

          Перевірка з тестовими (вигаданими) даними:
          1. «Додати рейс» -> «Відкрити існуючий рейс» -> тека local-browser-test-data\active-trip -> «Підключити рейс».
          2. «Підключити водіїв» -> «Цей комп'ютер» або «Та сама мережа Wi-Fi».
          3. Відкрийте посилання для водія з блока «Що робити далі».
          Для телефона в мережі дозвольте програму в брандмауері комп'ютера.

          Ліцензія: LICENSE.md. Сторонні компоненти: THIRD_PARTY_NOTICES.md і THIRD_PARTY_LICENSES.txt.
          "@ | Set-Content -Encoding UTF8 "$packageName/README.txt"

          $windowsZip = "$packageName.zip"
          Compress-Archive -Path "$packageName" -DestinationPath $windowsZip -CompressionLevel Optimal
          $windowsEntries = tar -tf $windowsZip
          if (-not ($windowsEntries | Where-Object { $_ -like "$packageName/*" })) {
            throw "Windows archive must contain the versioned package root folder: $packageName"
          }

          $plannerPackage = "Cargo-Dispatch-Planner-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Force $plannerPackage | Out-Null
          Copy-Item "target/release/cargo-dispatch-planner-desktop.exe" "$plannerPackage/Cargo-Dispatch-Planner.exe"
          Copy-Item "LICENSE.md", "COPYRIGHT.md", "THIRD_PARTY_NOTICES.md", "licenses/THIRD_PARTY_LICENSES.txt" -Destination "$plannerPackage"
          @"
          Cargo Dispatch Planner $env:TAG — Windows x64

          Запустіть Cargo-Dispatch-Planner.exe. Програма не підписана.

          Заявки з файла (JSON) або вручну, варіанти маршрутів, чернетка маршруту,
          попередній маршрут через ваш сервер Valhalla, експорт пакета рейсу (ZIP)
          для Control. Вісім мов інтерфейсу.

          Ліцензія: LICENSE.md. Сторонні компоненти: THIRD_PARTY_NOTICES.md і THIRD_PARTY_LICENSES.txt.
          "@ | Set-Content -Encoding UTF8 "$plannerPackage/README.txt"
          $plannerWindowsZip = "$plannerPackage.zip"
          Compress-Archive -Path "$plannerPackage" -DestinationPath $plannerWindowsZip -CompressionLevel Optimal
          $plannerEntries = tar -tf $plannerWindowsZip
          if (-not ($plannerEntries | Where-Object { $_ -like "$plannerPackage/*" })) {
            throw "Planner Windows archive must contain the versioned package root folder: $plannerPackage"
          }

          $android = Get-ChildItem "mobile-assets/Cargo-Dispatch-Driver-*-Android-debug.apk" | Select-Object -First 1
          $apple = Get-ChildItem "mobile-assets/Cargo-Dispatch-Driver-*-iOS-Simulator.zip" | Select-Object -First 1
          $macos = Get-ChildItem "desktop-assets/Cargo-Dispatch-Control-*-macOS-universal.zip" | Select-Object -First 1
          $linux = Get-ChildItem "desktop-assets/Cargo-Dispatch-Control-*-Linux-x64.tar.gz" | Select-Object -First 1
          $gateway = Get-ChildItem "server-assets/Cargo-Dispatch-Gateway-*-Linux-x64.tar.gz" | Select-Object -First 1
          $plannerMacos = Get-ChildItem "planner-assets/Cargo-Dispatch-Planner-*-macOS-universal.zip" | Select-Object -First 1
          $plannerLinux = Get-ChildItem "planner-assets/Cargo-Dispatch-Planner-*-Linux-x64.tar.gz" | Select-Object -First 1
          if (-not $android -or -not $apple -or -not $macos -or -not $linux -or -not $gateway -or -not $plannerMacos -or -not $plannerLinux) {
            throw "Required release assets are missing"
          }
          Copy-Item $android.FullName $android.Name
          Copy-Item $apple.FullName $apple.Name
          Copy-Item $macos.FullName $macos.Name
          Copy-Item $linux.FullName $linux.Name
          Copy-Item $gateway.FullName $gateway.Name
          Copy-Item $plannerMacos.FullName $plannerMacos.Name
          Copy-Item $plannerLinux.FullName $plannerLinux.Name

          function Assert-VersionedArchiveRoot([string]$ArchivePath) {
            $leaf = Split-Path $ArchivePath -Leaf
            if ($leaf.EndsWith(".tar.gz")) {
              $expectedRoot = $leaf.Substring(0, $leaf.Length - 7)
            } elseif ($leaf.EndsWith(".zip")) {
              $expectedRoot = $leaf.Substring(0, $leaf.Length - 4)
            } else {
              throw "Unsupported archive type for root-folder validation: $leaf"
            }
            $entries = @(tar -tf $ArchivePath | Where-Object { $_ -and $_ -ne "./" })
            if ($entries.Count -eq 0) {
              throw "Archive is empty: $leaf"
            }
            $bad = @($entries | Where-Object {
              $normalized = $_ -replace "\\", "/"
              -not ($normalized -eq $expectedRoot -or $normalized.StartsWith("$expectedRoot/"))
            })
            if ($bad.Count -gt 0) {
              throw "Archive $leaf must contain only one versioned root folder '$expectedRoot'. Unexpected entry: $($bad[0])"
            }
          }

          @($windowsZip, $plannerWindowsZip, $macos.Name, $linux.Name, $plannerMacos.Name, $plannerLinux.Name, $apple.Name, $gateway.Name) | ForEach-Object {
            Assert-VersionedArchiveRoot $_
          }

          Copy-Item "licenses/THIRD_PARTY_LICENSES.txt" "THIRD_PARTY_LICENSES.txt"

          @($windowsZip, $plannerWindowsZip, $macos.Name, $linux.Name, $plannerMacos.Name, $plannerLinux.Name, $android.Name, $apple.Name, $gateway.Name, "LICENSE.md", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.txt") | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Підготувати опис стабільного релізу
        shell: pwsh
        run: |
          @"
          ## Що це

          Cargo Dispatch $env:TAG — стабільна контрольна версія. Розробка триває; «стабільна» означає зафіксований набір, зібраний з одного коміту після повних автоматичних перевірок.

          ## Пакети

          | Пакет | Платформа |
          |---|---|
          | Control (диспетчер) | Windows x64, macOS universal, Linux x64 |
          | Planner (планування) | Windows x64, macOS universal, Linux x64 |
          | Водій, Android | debug APK |
          | Водій, iPhone та iPad | лише для Apple Simulator |
          | Addressing Gateway | Linux x64, з Dockerfile і Compose |

          SHA256SUMS.txt містить контрольні суми всіх файлів релізу.

          ## Нове порівняно з v0.2.0

          - Planner: заявки з файла (JSON, зручний для людини й ШІ) або вручну; помилка називає поле. До трьох варіантів порядку зупинок з урахуванням місткості авто; дорога рахується через ваш сервер Valhalla, якщо його налаштовано. Обраний варіант стає чернеткою рейсу, далі звичайний експорт пакета для Control.
          - Planner: заявки, авто, налаштування Valhalla й увесь розділ пакета рейсу (тип авто, вантажі, параметри авто) зберігаються між запусками.
          - Planner, виправлення: кнопка «Нижче» біля точки маршруту тепер діє (у v0.2.0 вона нічого не робила); прибрана з маршруту точка відчіплюється від вантажу; десяткові параметри можна набирати з комою чи крапкою; список мов показує вибрану мову.
          - Control: після перезапуску підключені рейси відкриваються самі з тими самими посиланнями водіїв, відновлюються й налаштування Valhalla. Зв'язок вмикається вручну; для Gateway знову вводяться адреса й секрет (вони не зберігаються).
          - Сторінка водія, застосунки Android та iPhone/iPad і Addressing Gateway за можливостями не змінилися.

          ## Що перевірено

          - Автоматично: перевірки коду, залежностей і перекладів, тести ядра, служб Control і Planner, Android та ядра iOS, запуск Gateway із релізного пакета.
          - Віртуально: вікно Planner у браузері без вікна разом зі справжньою службою Planner (файл заявок, варіанти, вибір і заміна маршруту, правки пакета рейсу, повернення введеного після перезапуску служби, експорт, мови); підмінені лише міст між вікном і службою та вікна вибору файлів.
          - Сторінка водія й застосунки водія перевірялися віртуально під час випуску v0.2.0 (браузер без вікна, емулятор Android, симулятор iPhone).
          - Вручну: нових ручних перевірок після v0.2.0 не було. Control для Windows і сторінку водія на планшеті в локальній мережі перевірено на ранішій тестовій збірці.

          ## Що не перевірено

          - Planner вручну; Control із цими змінами в запущеній програмі.
          - Розрахунок дороги на справжньому сервері Valhalla.
          - Застосунки Android та iPhone/iPad на фізичних пристроях.
          - У застосунках: саме відкриття навігатора, прив'язка файла до точки з камери чи галереї, неприйняті файли.
          - Control для macOS і Linux вручну.
          - Gateway у реальній мережі, зв'язок через мобільний інтернет.

          ## Відомі обмеження

          - Пакети не підписані; macOS і Windows можуть попереджати під час запуску.
          - Android APK підписаний тимчасовим ключем збірки: перед встановленням іншої версії старий застосунок треба видалити (його локальні дані при цьому зникають).
          - Застосунок для iPhone та iPad поки лише для Apple Simulator.
          - Planner не шукає координати за адресою: їх вносить оператор або файл.
          - Час прибуття на зупинки ще не розраховується; часи й примітки заявок не потрапляють у пакет рейсу.
          - Після перезапуску Control зв'язок вмикається вручну.

          ## Запуск

          Розпакуйте архів і відкрийте програму; поряд лежить README.txt. Gateway ставиться за HTTPS reverse proxy.

          ## Ліцензія

          Власницьке програмне забезпечення: LICENSE.md. Сторонні компоненти: THIRD_PARTY_NOTICES.md і THIRD_PARTY_LICENSES.txt (тексти залежностей Android сюди не входять).
          "@ | Set-Content -Encoding UTF8 RELEASE_NOTES.md

      - name: Keep the packages of a dry run
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cargo-Dispatch-Stable-dry-run
          retention-days: 3
          if-no-files-found: error
          path: |
            Cargo-Dispatch-*.zip
            Cargo-Dispatch-*.tar.gz
            Cargo-Dispatch-*.apk
            LICENSE.md
            THIRD_PARTY_NOTICES.md
            THIRD_PARTY_LICENSES.txt
            SHA256SUMS.txt
            RELEASE_NOTES.md

      - name: Check that every release asset exists
        shell: pwsh
        run: |
          $assets = @(
            "Cargo-Dispatch-Control-$env:TAG-Windows-x64.zip",
            "Cargo-Dispatch-Planner-$env:TAG-Windows-x64.zip",
            "Cargo-Dispatch-Control-$env:TAG-macOS-universal.zip",
            "Cargo-Dispatch-Control-$env:TAG-Linux-x64.tar.gz",
            "Cargo-Dispatch-Planner-$env:TAG-macOS-universal.zip",
            "Cargo-Dispatch-Planner-$env:TAG-Linux-x64.tar.gz",
            "Cargo-Dispatch-Driver-$env:TAG-Android-debug.apk",
            "Cargo-Dispatch-Driver-$env:TAG-iOS-Simulator.zip",
            "Cargo-Dispatch-Gateway-$env:TAG-Linux-x64.tar.gz",
            "LICENSE.md",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES.txt",
            "SHA256SUMS.txt"
          )
          $missing = @($assets | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw "Missing release assets: $($missing -join ', ')" }

      - name: Опублікувати стабільний реліз у GitHub
        if: needs.prepare.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "Cargo-Dispatch-Control-$env:TAG-Windows-x64.zip",
            "Cargo-Dispatch-Planner-$env:TAG-Windows-x64.zip",
            "Cargo-Dispatch-Control-$env:TAG-macOS-universal.zip",
            "Cargo-Dispatch-Control-$env:TAG-Linux-x64.tar.gz",
            "Cargo-Dispatch-Planner-$env:TAG-macOS-universal.zip",
            "Cargo-Dispatch-Planner-$env:TAG-Linux-x64.tar.gz",
            "Cargo-Dispatch-Driver-$env:TAG-Android-debug.apk",
            "Cargo-Dispatch-Driver-$env:TAG-iOS-Simulator.zip",
            "Cargo-Dispatch-Gateway-$env:TAG-Linux-x64.tar.gz",
            "LICENSE.md",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES.txt",
            "SHA256SUMS.txt"
          )
          $missing = @($assets | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw "Missing release assets: $($missing -join ', ')" }
          gh release create "$env:TAG" `
            --repo "${{ github.repository }}" `
            --target "$env:GITHUB_SHA" `
            --title "Cargo Dispatch $env:TAG — стабільна версія" `
            --notes-file RELEASE_NOTES.md `
            --latest `
            @assets
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
