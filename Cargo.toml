[workspace]
resolver = "2"
members = [
  "crates/ui-probe-core",
  "apps/leptos-web",
  "apps/driver-web",
  "apps/tauri-shell/src-tauri",
]

[workspace.package]
edition = "2024"
license = "BUSL-1.1"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
